<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>ZENITE — Seu consultor financeiro particular</title>
<meta name="description" content="ZENITE: o sistema operacional da sua vida financeira. Orçamento inteligente, metas, dívidas e insights automáticos." />
<meta name="theme-color" content="#05070c" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
/* ================= DESIGN SYSTEM ================= */
:root{
  color-scheme: dark;
  --page:#05070c;
  --bg-grad-1: radial-gradient(1200px 600px at 12% -10%, rgba(34,211,238,.14), transparent 60%),
               radial-gradient(1000px 500px at 100% 0%, rgba(124,108,255,.14), transparent 55%),
               radial-gradient(900px 700px at 50% 120%, rgba(16,185,129,.07), transparent 55%);
  --surface: rgba(19,26,41,.55);
  --surface-2: rgba(27,37,56,.65);
  --surface-solid:#121a29;
  --border: rgba(148,180,214,.14);
  --border-soft: rgba(148,180,214,.09);
  --text:#f6f6f8;
  --text-dim:#9aa5b4;
  --text-mute:#63707f;
  --brand-a:#8b7bff;
  --brand-b:#22d3ee;
  --brand-grad: linear-gradient(135deg, var(--brand-a), var(--brand-b));
  --brand-grad-soft: linear-gradient(135deg, rgba(139,123,255,.18), rgba(34,211,238,.14));
  --good:#1fd35a;
  --good-text:#3fe373;
  --warning:#fab219;
  --serious:#ec835a;
  --critical:#ef4a4a;
  --glow-cyan: rgba(34,211,238,.4);
  --card-navy: linear-gradient(165deg, rgba(24,33,53,.78), rgba(9,13,22,.85));
  --c1:#3987e5; --c2:#d95926; --c3:#1baf7a; --c4:#c98500;
  --c5:#d55181; --c6:#2fbf4f; --c7:#9085e9; --c8:#e66767;
  --radius-lg:22px; --radius-md:16px; --radius-sm:11px;
  --shadow-card: 0 10px 40px rgba(0,0,0,.35);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-size: 16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{height:100%;}
body{
  margin:0; background: var(--page); background-image: var(--bg-grad-1); background-attachment: fixed;
  color: var(--text); font-family:"Inter", -apple-system, BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden; min-height:100vh;
}
h1,h2,h3,.num{ font-family:"Inter Tight","Inter",sans-serif; letter-spacing:-.02em; }
button{ font-family:inherit; }
::selection{ background: rgba(139,123,255,.35); }
a{ color:inherit; text-decoration:none; }
input,select,textarea{ font-family:inherit; }

/* scrollbar */
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.12); border-radius:8px; }

/* layout shells */
#app{ max-width:560px; margin:0 auto; min-height:100vh; padding-bottom: calc(92px + var(--safe-bottom)); position:relative; }
.topbar{
  position:sticky; top:0; z-index:20; padding: calc(16px + var(--safe-top)) 18px 12px;
  background: linear-gradient(to bottom, rgba(5,7,12,.92) 60%, rgba(5,7,12,0));
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.brand{ display:flex; align-items:center; gap:9px; }
.brand-mark{ width:30px; height:30px; border-radius:9px; background: var(--brand-grad); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:#0a0a0c; box-shadow:0 4px 16px rgba(139,123,255,.35);}
.brand-name{ font-weight:800; font-size:15px; letter-spacing:.02em; }
.topbar-actions{ display:flex; align-items:center; gap:8px; }
.icon-btn{
  width:38px; height:38px; border-radius:12px; border:1px solid var(--border); background: var(--surface);
  color: var(--text-dim); display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition: transform .15s ease, background .15s ease, color .15s ease;
}
.icon-btn:active{ transform: scale(.92); }
.icon-btn.active{ color: var(--good-text); background: rgba(31,211,90,.12); border-color: rgba(31,211,90,.35); }

main{ padding: 6px 18px 24px; }
.screen{ display:flex; flex-direction:column; gap:16px; animation: fadeUp .35s ease; }
@keyframes fadeUp{ from{ opacity:0; transform: translateY(8px);} to{ opacity:1; transform:none; } }

/* cards */
.card{
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg);
  padding:18px; box-shadow: var(--shadow-card); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  position:relative; overflow:hidden;
}
.card.glow{
  background: var(--card-navy);
  border-color: rgba(94,234,212,.22);
  box-shadow: 0 0 0 1px rgba(34,211,238,.10), 0 0 70px -18px var(--glow-cyan), 0 24px 60px rgba(0,0,0,.55);
}
.card.glow::before{
  content:""; position:absolute; inset:-1px; border-radius:inherit; padding:1px;
  background: linear-gradient(135deg, rgba(34,211,238,.75), rgba(139,123,255,.4), rgba(34,211,238,.08) 70%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude; pointer-events:none;
}
.card-title{ font-size:13px; color: var(--text-dim); font-weight:600; letter-spacing:.02em; margin:0 0 4px; }
.card-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.section-title{ font-size:19px; font-weight:800; margin: 4px 2px 2px; display:flex; align-items:center; justify-content:space-between; }
.section-sub{ font-size:12.5px; color: var(--text-mute); margin: -8px 2px 0; }
.link-btn{ font-size:12.5px; font-weight:700; color: var(--brand-b); cursor:pointer; }

/* card header with icon badge, à la referência */
.card-head{ display:flex; align-items:center; gap:10px; }
.card-head .ic{ width:30px; height:30px; border-radius:10px; background: rgba(34,211,238,.12); border:1px solid rgba(34,211,238,.28); color:#5eead4; display:flex; align-items:center; justify-content:center; flex:0 0 auto; box-shadow: 0 0 16px rgba(34,211,238,.18); }
.card-head .t{ font-weight:800; font-size:14.5px; letter-spacing:.01em; }

/* hero balance */
.hero{ padding:22px 20px 20px; }
.hero-label{ font-size:12.5px; color: var(--text-dim); font-weight:600; }
.hero-amount{ font-size:38px; font-weight:800; margin:6px 0 14px; line-height:1.05; }
.hero-amount.neg{ color: var(--critical); }
.dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }

/* linha de estatísticas com divisores, à la referência */
.divider-stats{ display:flex; border:1px solid rgba(148,180,214,.16); border-radius: var(--radius-md); overflow:hidden; background: rgba(255,255,255,.02); }
.divider-stats .dstat{ flex:1; padding:12px 6px 12px 12px; min-width:0; }
.divider-stats .dstat + .dstat{ border-left:1px solid rgba(148,180,214,.16); }
.divider-stats .dstat .lbl{ display:flex; align-items:center; gap:5px; font-size:9.5px; color:var(--text-mute); font-weight:700; text-transform:uppercase; letter-spacing:.02em; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.divider-stats .dstat .val{ font-size:13px; font-weight:800; line-height:1.25; word-break:break-word; }
.divider-stats .dstat .sub2{ font-size:9.5px; color:var(--text-mute); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.divider-stats .dstat .lbl svg{ flex:0 0 auto; }

/* stat grid */
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

/* progress bars */
.bar-track{ height:8px; border-radius:99px; background: rgba(255,255,255,.08); overflow:hidden; position:relative; }
.bar-fill{ height:100%; border-radius:99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.bar-fill.good{ background: linear-gradient(90deg,#1fd35a,#2fbf4f); }
.bar-fill.warning{ background: linear-gradient(90deg,#fab219,#e89a10); }
.bar-fill.serious{ background: linear-gradient(90deg,#ec835a,#e06a3d); }
.bar-fill.critical{ background: linear-gradient(90deg,#ef4a4a,#d03b3b); }
.bar-fill.brand{ background: var(--brand-grad); }

/* envelopes */
.env-item{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border-soft); }
.env-item:last-child{ border-bottom:none; }
.env-ic{ width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.goal-ic{ width:44px; height:44px; border-radius:13px; background: var(--brand-grad-soft); color:#c9c1ff; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.env-body{ flex:1; min-width:0; }
.env-top{ display:flex; justify-content:space-between; font-size:13.5px; font-weight:700; margin-bottom:6px; gap:8px; }
.env-top .pct{ font-weight:700; font-size:12px; }
.env-meta{ font-size:11px; color: var(--text-mute); margin-top:4px; display:flex; justify-content:space-between; }

/* chips */
.chip{ display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:99px; background: var(--surface-2); border:1px solid var(--border-soft); font-size:12px; font-weight:700; color:var(--text-dim); white-space:nowrap; }
.chip.on{ background: rgba(139,123,255,.16); border-color: rgba(139,123,255,.4); color:#c9c1ff; }
.chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
.chip-row::-webkit-scrollbar{ display:none; }
.badge{ font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:99px; text-transform:uppercase; letter-spacing:.03em; }
.badge.good{ background: rgba(31,211,90,.15); color: var(--good-text); }
.badge.warning{ background: rgba(250,178,25,.15); color: var(--warning); }
.badge.serious{ background: rgba(236,131,90,.16); color: var(--serious); }
.badge.critical{ background: rgba(239,74,74,.15); color: var(--critical); }
.badge.neutral{ background: rgba(255,255,255,.08); color: var(--text-dim); }

/* insight */
.insight{ display:flex; gap:12px; padding:14px; border-radius: var(--radius-md); background: var(--brand-grad-soft); border:1px solid rgba(139,123,255,.25); }
.insight .ic{ font-size:19px; flex:0 0 auto; }
.insight .tx{ font-size:13px; line-height:1.45; color:#e9e7ff; }
.insight .tx b{ color:#fff; }

/* transaction list */
.tx-item{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border-soft); cursor:pointer; }
.tx-item:last-child{ border-bottom:none; }
.tx-ic{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:16px; flex:0 0 auto; background: var(--surface-2); }
.tx-body{ flex:1; min-width:0; }
.tx-name{ font-size:13.5px; font-weight:700; }
.tx-meta{ font-size:11px; color: var(--text-mute); margin-top:2px; }
.tx-amt{ font-size:14px; font-weight:800; white-space:nowrap; }
.tx-amt.in{ color: var(--good-text); }
.tx-amt.out{ color: var(--text); }
.day-sep{ font-size:11px; font-weight:700; color: var(--text-mute); text-transform:uppercase; letter-spacing:.04em; padding:14px 2px 2px; }

/* buttons */
.btn{ border:none; border-radius:14px; padding:13px 18px; font-weight:700; font-size:14px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition: transform .12s ease, filter .12s ease; }
.btn:active{ transform: scale(.97); }
.btn-primary{ background: var(--brand-grad); color:#0a0a0c; width:100%; box-shadow:0 8px 24px rgba(139,123,255,.28); }
.btn-ghost{ background: var(--surface-2); color:var(--text); border:1px solid var(--border); }
.btn-block{ width:100%; }
.btn-sm{ padding:9px 14px; font-size:12.5px; border-radius:11px; }
.btn-danger{ background: rgba(239,74,74,.14); color:#ff8080; border:1px solid rgba(239,74,74,.3); }
.fab{
  position:fixed; right:calc(50% - 264px); bottom: calc(96px + var(--safe-bottom)); z-index:30;
  width:58px; height:58px; border-radius:50%; background: var(--brand-grad); border:none; color:#0a0a0c;
  font-size:26px; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 30px rgba(139,123,255,.45);
  cursor:pointer;
}
@media (max-width:576px){ .fab{ right:20px; } }

/* bottom nav */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:25; display:flex; justify-content:center;
  padding-bottom: var(--safe-bottom);
}
.tabbar-inner{
  width:100%; max-width:560px; display:flex; background: rgba(15,15,18,.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top:1px solid var(--border); padding:9px 6px 8px;
}
.tab-btn{ flex:1; background:none; border:none; color: var(--text-mute); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:700; padding:5px 2px; cursor:pointer; }
.tab-btn .ic{ font-size:19px; line-height:1; }
.tab-btn.active{ color:#fff; }
.tab-btn.active .ic{ filter: drop-shadow(0 0 10px rgba(139,123,255,.6)); }

/* forms & modal */
.modal-backdrop{ position:fixed; inset:0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); z-index:50; display:none; align-items:flex-end; justify-content:center; }
.modal-backdrop.open{ display:flex; animation: fadeIn .2s ease; }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.modal-sheet{
  width:100%; max-width:560px; max-height:88vh; overflow-y:auto; background: #131316; border:1px solid var(--border);
  border-radius: 24px 24px 0 0; padding: 16px 18px calc(24px + var(--safe-bottom)); animation: slideUp .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideUp{ from{ transform: translateY(30px); opacity:.6; } to{ transform:none; opacity:1; } }
.modal-handle{ width:38px; height:4px; background: rgba(255,255,255,.18); border-radius:99px; margin:2px auto 14px; }
.modal-title{ font-size:18px; font-weight:800; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
.field{ margin-bottom:13px; }
.field label{ font-size:12px; font-weight:700; color: var(--text-dim); display:block; margin-bottom:6px; }
.field input, .field select, .field textarea{
  width:100%; background: var(--surface-2); border:1px solid var(--border); color: var(--text);
  border-radius:12px; padding:12px 13px; font-size:14.5px; outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color: rgba(139,123,255,.55); }
.field-row{ display:flex; gap:10px; }
.field-row .field{ flex:1; }
.seg{ display:flex; background: var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:3px; gap:3px; }
.seg button{ flex:1; border:none; background:none; color: var(--text-dim); padding:9px 6px; border-radius:9px; font-weight:700; font-size:12.5px; cursor:pointer; }
.seg button.active{ background: var(--brand-grad); color:#0a0a0c; }
.icon-pick{ display:flex; flex-wrap:wrap; gap:8px; }
.icon-pick button{ width:40px; height:40px; border-radius:11px; border:1px solid var(--border); background: var(--surface-2); color: var(--text-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; }
.icon-pick button.active{ border-color: var(--brand-a); background: rgba(139,123,255,.18); color:#c9c1ff; }
.color-pick{ display:flex; flex-wrap:wrap; gap:8px; }
.color-pick button{ width:28px; height:28px; border-radius:50%; border:2px solid transparent; cursor:pointer; }
.color-pick button.active{ border-color:#fff; }

/* empty state */
.empty{ text-align:center; padding:40px 16px; color: var(--text-mute); }
.empty .ic{ font-size:34px; margin-bottom:10px; }
.empty .t{ font-size:13.5px; font-weight:600; color: var(--text-dim); }

/* misc */
.money.blurred{ filter: blur(7px); user-select:none; }
.two-col{ display:flex; gap:12px; }
.two-col > *{ flex:1; }
table.datatable{ width:100%; border-collapse:collapse; font-size:12px; margin-top:10px; }
table.datatable th{ text-align:left; color: var(--text-mute); font-weight:700; padding:6px 4px; border-bottom:1px solid var(--border); font-size:11px; }
table.datatable td{ padding:7px 4px; border-bottom:1px solid var(--border-soft); }
.swipe-actions{ display:flex; gap:8px; margin-top:8px; }
.gauge-wrap{ display:flex; align-items:center; gap:14px; }
.level-ring{ position:relative; width:64px; height:64px; flex:0 0 auto; }
.pin-screen{ position:fixed; inset:0; z-index:100; background:var(--page); background-image: var(--bg-grad-1); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:24px; }
.pin-dots{ display:flex; gap:14px; }
.pin-dot{ width:14px; height:14px; border-radius:50%; border:2px solid var(--text-mute); }
.pin-dot.filled{ background: var(--brand-grad); border-color: transparent; }
.pin-pad{ display:grid; grid-template-columns:repeat(3,64px); gap:16px; }
.pin-key{ width:64px; height:64px; border-radius:50%; border:1px solid var(--border); background: var(--surface-2); color:#fff; font-size:20px; font-weight:700; cursor:pointer; }
.pin-key:active{ background: var(--surface); }
.toast{ position:fixed; left:50%; bottom:calc(110px + var(--safe-bottom)); transform:translateX(-50%); background:#1c1c20; border:1px solid var(--border); padding:11px 18px; border-radius:99px; font-size:12.5px; font-weight:700; z-index:80; box-shadow:0 10px 30px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition: opacity .25s ease, transform .25s ease; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }
canvas{ display:block; max-width:100%; }
.legend{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
.legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color: var(--text-dim); font-weight:600; }
.legend-dot{ width:9px; height:9px; border-radius:3px; }
.tooltip-box{ position:absolute; background:#1c1c20; border:1px solid var(--border); border-radius:10px; padding:8px 10px; font-size:11px; pointer-events:none; z-index:5; box-shadow:0 8px 20px rgba(0,0,0,.4); white-space:nowrap; }
</style>
</head>
<body>
<div id="pinScreen"></div>
<div id="app"></div>
<button class="fab" id="fabAdd" title="Adicionar lançamento">+</button>
<div class="tabbar"><div class="tabbar-inner" id="tabbar"></div></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal-sheet" id="modalSheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ===================================================================
   ZENITE — Sistema Operacional Financeiro Pessoal
   Armazenamento local (privacidade em primeiro lugar). Sem servidor.
=================================================================== */

/* ---------- estado & persistência ---------- */
const STORAGE_KEY = 'zenite_state_v1';
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const todayISO = () => new Date().toISOString().slice(0,10);

/* Conjunto de ícones de linha, autorais — substitui emojis genéricos do sistema
   por um único estilo consistente (mesmo espírito da marca ÓRBITA). */
const ICONS = {
  home:   '<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/>',
  food:   '<circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.4"/>',
  car:    '<path d="M4.5 16V11.5a1.6 1.6 0 0 1 1-1.5l1.3-3.4A1.8 1.8 0 0 1 8.5 5.5h7a1.8 1.8 0 0 1 1.7 1.1L18.5 10a1.6 1.6 0 0 1 1 1.5V16"/><line x1="3.5" y1="16" x2="20.5" y2="16"/><circle cx="7.5" cy="16.5" r="1.6"/><circle cx="16.5" cy="16.5" r="1.6"/>',
  film:   '<rect x="3.5" y="8" width="17" height="11" rx="1.5"/><path d="M3.5 8 6 4h3l-2.5 4z"/><path d="M9.5 8 12 4h3l-2.5 4z"/><path d="M15.5 8 18 4h1a1 1 0 0 1 1 1v3z"/>',
  health: '<circle cx="12" cy="12" r="8"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>',
  book:   '<path d="M4 5.5A2 2 0 0 1 6 3.5h5v17H6a2 2 0 0 1-2-2z"/><path d="M20 5.5a2 2 0 0 0-2-2h-5v17h5a2 2 0 0 0 2-2z"/>',
  phone:  '<rect x="7" y="2.5" width="10" height="19" rx="2"/><line x1="10.5" y1="18" x2="13.5" y2="18"/>',

/* ---------- helpers ---------- */
const fmtBRL = (v) => (v<0? '-':'') + 'R$ ' + Math.abs(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
function money(v, cls=''){ return `<span class="money ${state.privacy.hideValues?'blurred':''} ${cls}">${fmtBRL(v)}</span>`; }
function monthKey(d=new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function daysInMonth(d=new Date()){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function fmtDate(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}); }
function fmtDateLong(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}); }
function monthLabel(offset=0){
  const d = new Date(); d.setMonth(d.getMonth()+offset);
  return d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
}
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

function txForMonth(offset=0){
  const key = monthKey(new Date(new Date().setMonth(new Date().getMonth()+offset)));
  return state.transactions.filter(t => t.date.slice(0,7) === key);
}
function sumBy(list, type){ return list.filter(t=>t.type===type).reduce((s,t)=>s+t.amount,0); }

function envelopeSpent(envId, offset=0){
  return txForMonth(offset).filter(t=>t.type==='expense' && t.envelopeId===envId).reduce((s,t)=>s+t.amount,0);
}
function statusForPct(pct){
  if(pct >= 1) return 'critical';
  if(pct >= .9) return 'serious';
  if(pct >= .8) return 'warning';
  return 'good';
}
function statusLabel(s){ return {good:'No ritmo', warning:'Atenção', serious:'Quase no limite', critical:'Estourou'}[s]; }

/* ---------- score & recomendações ---------- */
function computeMetrics(){
  const thisMonth = txForMonth(0);
  const income = sumBy(thisMonth,'income') + (state.income.monthlyBase||0);
  const expenses = sumBy(thisMonth,'expense');
  const savings = income - expenses;
  const savingsRate = income>0 ? savings/income : 0;
  const totalBudget = state.envelopes.reduce((s,e)=>s+ (e.budget||0), 0);
  const spentAll = state.envelopes.reduce((s,e)=>s+envelopeSpent(e.id,0),0);
  const now = new Date();
  const dim = daysInMonth(now);
  const dayOfMonth = now.getDate();
  const daysLeft = Math.max(1, dim - dayOfMonth + 1);
  const availableToday = Math.max(0, totalBudget - spentAll) / daysLeft;
  const overBudgetCount = state.envelopes.filter(e => e.budget>0 && envelopeSpent(e.id,0) >= e.budget).length;
  const budgetAdherence = state.envelopes.length ? 1 - clamp(overBudgetCount/state.envelopes.length,0,1) : 1;

  let goalOnTrackRatio = 1;
  if(state.goals.length){
    let onTrack = 0;
    state.goals.forEach(g=>{
      const needed = requiredMonthly(g);
      const gotThisMonth = (g.contributions||[]).filter(c=>c.date.slice(0,7)===monthKey()).reduce((s,c)=>s+c.amount,0);
      if(needed<=0 || gotThisMonth >= needed*0.9) onTrack++;
    });
    goalOnTrackRatio = onTrack/state.goals.length;
  }

  const streak = state.gamification.streak||0;
  const savingsScore = clamp(savingsRate/0.2,0,1) * 40;
  const budgetScore = budgetAdherence * 30;
  const goalScore = goalOnTrackRatio * 20;
  const streakScore = clamp(streak/30,0,1) * 10;
  const score = Math.round(savingsScore+budgetScore+goalScore+streakScore);

  return { income, expenses, savings, savingsRate, totalBudget, spentAll, daysLeft, dayOfMonth, dim, availableToday, score, overBudgetCount };
}

function requiredMonthly(goal){
  if(!goal.deadline) return 0;
  const remaining = Math.max(0, goal.target - goal.saved);
  const months = Math.max(1, monthsBetween(todayISO(), goal.deadline));
  return remaining / months;
}
function monthsBetween(iso1, iso2){
  const a = new Date(iso1+'T00:00:00'), b = new Date(iso2+'T00:00:00');
  return Math.max(0, (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()) + (b.getDate()>=a.getDate()?0:-1)+1);
}
function goalMonthlyAvgContribution(goal){
  const c = goal.contributions||[];
  if(!c.length) return 0;
  const byMonth = {};
  c.forEach(x=>{ byMonth[x.date.slice(0,7)] = (byMonth[x.date.slice(0,7)]||0) + x.amount; });
  const months = Object.keys(byMonth);
  const total = months.reduce((s,m)=>s+byMonth[m],0);
  return total / months.length;
}

/* ---------- insights (motor de recomendações) ---------- */
function computeInsights(){
  const insights = [];
  const m = computeMetrics();

  if(m.income>0 && m.savings<0){
    insights.push({ic:'⚠️', text:`Você está gastando <b>${fmtBRL(Math.abs(m.savings))}</b> a mais do que ganha este mês. Vamos revisar seu orçamento antes que isso vire dívida.`});
  } else if(m.income>0){
    if(m.savingsRate>=0.2) insights.push({ic:'🏆', text:`Disciplina impecável: você está economizando <b>${(m.savingsRate*100).toFixed(0)}%</b> da sua renda este mês.`});
    else if(m.savingsRate>=0.1) insights.push({ic:'👍', text:`Boa taxa de economia (<b>${(m.savingsRate*100).toFixed(0)}%</b>). Tente chegar a 20% reduzindo uma categoria variável.`});
    else insights.push({ic:'💡', text:`Sua taxa de economia está em <b>${(m.savingsRate*100).toFixed(0)}%</b>. Pequenos cortes em lazer ou assinaturas já fazem diferença.`});
  }

  state.envelopes.forEach(env=>{
    const spentNow = envelopeSpent(env.id,0);
    const hist = [1,2,3].map(o=>envelopeSpent(env.id,-o));
    const validHist = hist.filter(h=>h>0);
    if(validHist.length>=1){
      const avg = validHist.reduce((s,v)=>s+v,0)/validHist.length;
      const projected = m.dayOfMonth>0 ? spentNow/m.dayOfMonth*m.dim : spentNow;
      if(avg>0 && projected > avg*1.2){
        const pctAbove = Math.round((projected/avg-1)*100);
        const yearlyIfReduced = Math.round(projected*0.15*12);
        insights.push({ic:'📊', text:`Gasto com <b>${esc(env.name)}</b> está ${pctAbove}% acima da sua média. Reduzindo 15%, você economizaria cerca de <b>${fmtBRL(yearlyIfReduced)}</b>/ano.`});
      }
    }
    if(env.budget>0){
      const pct = spentNow/env.budget;
      if(pct>=0.9 && pct<1) insights.push({ic:'🟠', text:`Orçamento de <b>${esc(env.name)}</b> já está em ${(pct*100).toFixed(0)}%. Faltam ${fmtBRL(Math.max(0,env.budget-spentNow))} até o limite.`});
      else if(pct>=1) insights.push({ic:'🔴', text:`Você estourou o orçamento de <b>${esc(env.name)}</b> em ${fmtBRL(spentNow-env.budget)}.`});
    }
  });

  state.goals.forEach(g=>{
    const needed = requiredMonthly(g);
    const avg = goalMonthlyAvgContribution(g);
    if(needed>0){
      if(avg >= needed*1.15){
        const monthsAhead = Math.max(1, Math.round((avg/needed - 1) * monthsBetween(todayISO(), g.deadline)));
        insights.push({ic:'🚀', text:`Meta <b>${esc(g.name)}</b> está adiantada! No ritmo atual, você chega até ${monthsAhead} mês(es) antes do prazo.`});
      } else if(avg>0 && avg < needed*0.7){
        insights.push({ic:'⏳', text:`Meta <b>${esc(g.name)}</b> está atrasada. Você precisa aportar em média ${fmtBRL(needed)}/mês para chegar no prazo.`});
      }
    }
  });

  if(!insights.length){
    insights.push({ic:'✨', text:'Continue registrando seus lançamentos — quanto mais dados, mais precisos ficam os seus insights.'});
  }
  return insights.slice(0,4);
}

/* ---------- gamificação ---------- */
function updateStreak(){
  const dates = [...new Set(state.transactions.map(t=>t.date))].sort();
  if(!dates.length){ state.gamification.streak = 0; return; }
  const set = new Set(dates);
  let streak = 0;
  let cursor = new Date();
  if(!set.has(todayISO())){
    cursor.setDate(cursor.getDate()-1);
  }
  while(true){
    const iso = cursor.toISOString().slice(0,10);
    if(set.has(iso)){ streak++; cursor.setDate(cursor.getDate()-1); } else break;
  }
  state.gamification.streak = streak;
}
function totalXP(){
  const txXP = state.transactions.length * 10;
  const goalXP = state.goals.filter(g=>g.saved>=g.target).length * 150;
  const streakXP = (state.gamification.streak||0) * 5;
  return txXP+goalXP+streakXP;
}
function levelInfo(){
  const xp = totalXP();
  const level = Math.floor(Math.sqrt(xp/50)) + 1;
  const currentFloor = 50*(level-1)*(level-1);
  const nextFloor = 50*level*level;
  const pct = clamp((xp-currentFloor)/(nextFloor-currentFloor||1),0,1);
  return {xp, level, pct, next: nextFloor};
}
function computeBadges(){
  const b = [];
  const push=(unlocked,ic,name,desc)=>b.push({unlocked,ic,name,desc});
  push(state.transactions.length>=1,'🌱','Primeiro Registro','Adicione seu primeiro lançamento');
  push((state.gamification.streak||0)>=7,'🔥','Uma Semana de Foco','7 dias seguidos registrando gastos');
  push((state.gamification.streak||0)>=30,'💎','Um Mês de Disciplina','30 dias seguidos registrando gastos');
  push(state.envelopes.length>0 && state.envelopes.every(e=>e.budget<=0 || envelopeSpent(e.id,0) < e.budget*0.9),'🛡️','Orçamento Sob Controle','Nenhuma categoria acima de 90%');
  push(state.goals.some(g=>g.saved>=g.target),'🏆','Meta Conquistada','Complete sua primeira meta');
  push(state.gamification.everHadDebt && state.debts.length===0,'🕊️','Livre de Dívidas','Quite todas as suas dívidas');
  push(computeMetrics().savingsRate>=0.2,'📈','Economista','20%+ de taxa de economia em um mês');
  return b;
}

function drawBarChart(){
  const canvas = document.getElementById('chartBars'); if(!canvas) return;
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h = 180;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const months = [-5,-4,-3,-2,-1,0];
  const data = months.map(o=>{
    const list = txForMonth(o);
    return { label: monthLabel(o), income: sumBy(list,'income')+(o===0?state.income.monthlyBase:0), expense: sumBy(list,'expense') };
  });
  const maxV = Math.max(1, ...data.map(d=>Math.max(d.income,d.expense)));
  const padL=8, padB=22, padT=32;
  const chartW = w-padL*2, chartH = h-padB-padT;
  const groupW = chartW/data.length;
  const barW = Math.min(16, groupW*0.28);
  ctx.strokeStyle = 'rgba(148,180,214,.16)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(padL, h-padB+.5); ctx.lineTo(w-padL, h-padB+.5); ctx.stroke();

  window._barPoints = [];
  data.forEach((d,i)=>{
    const cx = padL + groupW*i + groupW/2;
    const hIncome = (d.income/maxV)*chartH;
    const hExpense = (d.expense/maxV)*chartH;
    const incomeX = cx-barW-2, expenseX = cx+2;
    const incomeY = h-padB-hIncome, expenseY = h-padB-hExpense;
    ctx.fillStyle = getCss('--c1');
    roundRectTop(ctx, incomeX, incomeY, barW, hIncome, 4); ctx.fill();
    ctx.fillStyle = getCss('--c2');
    roundRectTop(ctx, expenseX, expenseY, barW, hExpense, 4); ctx.fill();

    if(i === data.length-1){
      drawMiniTag(ctx, incomeX+barW/2, incomeY, getCss('--c1'), formatCompact(d.income));
      drawMiniTag(ctx, expenseX+barW/2, expenseY, getCss('--c2'), formatCompact(d.expense));
    }

    ctx.fillStyle = 'rgba(199,212,230,.6)'; ctx.font='700 10px Inter'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText(d.label, cx, h-6);
    window._barPoints.push({x:cx, y0:h-padB-Math.max(hIncome,hExpense), y1:h-padB, w:groupW, d});
  });

  renderTable('bars', ['Mês','Receitas','Despesas'], data.map(d=>[d.label, fmtBRL(d.income), fmtBRL(d.expense)]));
}
function roundRectTop(ctx,x,y,w,h,r){
  h = Math.max(h,1);
  ctx.beginPath();
  ctx.moveTo(x, y+r);
  ctx.arcTo(x,y,x+r,y,r);
  ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w, y+h); ctx.lineTo(x,y+h); ctx.closePath();
}
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function formatCompact(v){
  if(v>=1000) return 'R$'+(v/1000).toFixed(v%1000===0?0:1).replace('.',',')+'k';
  return 'R$'+Math.round(v);
}
function drawMiniTag(ctx, cx, barTopY, color, text){
  ctx.font = '800 9.5px Inter';
  const tagW = ctx.measureText(text).width + 10, tagH = 16;
  const tagX = cx - tagW/2, tagY = Math.max(1, barTopY - tagH - 5);
  roundRectFull(ctx, tagX, tagY, tagW, tagH, tagH/2);
  ctx.fillStyle = 'rgba(6,10,18,.92)'; ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, cx, tagY + tagH/2 + 0.5);
  ctx.textBaseline = 'alphabetic';
}
function roundRectFull(ctx,x,y,w,h,r){
  r = Math.min(r, h/2, Math.max(w,0.01)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawAttentionChart(){
  const canvas = document.getElementById('chartAttn'); if(!canvas) return;
  const list = [...state.envelopes].sort((a,b)=> (envelopeSpent(b.id,0)/(b.budget||1)) - (envelopeSpent(a.id,0)/(a.budget||1)) ).slice(0,4);
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h = 188;
  canvas.style.height = h+'px';
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);

  const padTop = 34, padBottom = 22;
  const chartH = h - padTop - padBottom;
  const slotW = w / list.length;
  const barW = Math.min(48, slotW*0.4);

  ctx.strokeStyle = 'rgba(148,180,214,.16)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, h-padBottom+.5); ctx.lineTo(w, h-padBottom+.5); ctx.stroke();

  window._attnPoints = [];
  list.forEach((e,i)=>{
    const spent = envelopeSpent(e.id,0);
    const pct = e.budget>0 ? spent/e.budget : 0;
    const status = statusForPct(pct);
    const color = getCss('--'+(status==='good'?'good-text':status));
    const cx = slotW*i + slotW/2;
    const barH = Math.max(clamp(pct,0,1) * chartH, 3);
    const barY = h - padBottom - barH;

    ctx.fillStyle = color;
    roundRectTop(ctx, cx-barW/2, barY, barW, barH, 7); ctx.fill();

    const label = Math.round(pct*100)+'%';
    ctx.font = '800 11px Inter';
    const tagW = ctx.measureText(label).width + 16, tagH = 21;
    const tagX = cx - tagW/2, tagY = Math.max(2, barY - tagH - 7);
    roundRectFull(ctx, tagX, tagY, tagW, tagH, tagH/2);
    ctx.fillStyle = 'rgba(6,10,18,.92)'; ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, cx, tagY + tagH/2 + 0.5);

    let name = e.name; if(name.length > 9) name = name.slice(0,8)+'…';
    ctx.fillStyle = 'rgba(199,212,230,.65)'; ctx.font = '700 10.5px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(name, cx, h-6);

    window._attnPoints.push({ x0: slotW*i, x1: slotW*(i+1), e, spent, pct });
  });

  renderTable('attn', ['Categoria','Gasto','Orçamento','%'], list.map(e=>{
    const spent = envelopeSpent(e.id,0);
    const pct = e.budget>0 ? spent/e.budget : 0;
    return [e.name, fmtBRL(spent), fmtBRL(e.budget), Math.round(pct*100)+'%'];
  }));
}

function drawDonut(){
  const canvas = document.getElementById('chartDonut'); if(!canvas) return;
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h=220;
  canvas.width=w*dpr; canvas.height=h*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const cx=w/2, cy=h/2, rOuter=Math.min(w,h)/2-10, rInner=rOuter*0.56;
  let data = state.envelopes.map((e,i)=>({name:e.name, val: envelopeSpent(e.id,0), color: ENVELOPE_COLORS[i%ENVELOPE_COLORS.length]}))
    .filter(d=>d.val>0).sort((a,b)=>b.val-a.val);
  if(data.length>8){
    const rest = data.slice(7).reduce((s,d)=>s+d.val,0);
    data = data.slice(0,7).concat([{name:'Outros', val:rest, color:'#5b5b63'}]);
  }
  const total = data.reduce((s,d)=>s+d.val,0);
  if(!total){
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.font='12px Inter'; ctx.textAlign='center';
    ctx.fillText('Sem despesas registradas este mês', cx, cy);
    document.getElementById('donutLegend').innerHTML='';
    renderTable('donut', ['Categoria','Valor'], []);
    return;
  }
  let start = -Math.PI/2;
  window._donutSlices = [];
  data.forEach(d=>{
    const angle = (d.val/total)*Math.PI*2;
    ctx.save();
    ctx.shadowColor = d.color; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,rOuter,start,start+angle); ctx.closePath();
    ctx.fillStyle = d.color; ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(6,10,18,.9)'; ctx.lineWidth = 2; ctx.stroke();
    window._donutSlices.push({start, end:start+angle, d});
    start += angle;
  });
  ctx.globalCompositeOperation='destination-out';
  ctx.beginPath(); ctx.arc(cx,cy,rInner,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#fff'; ctx.font='800 15px "Inter Tight"'; ctx.textAlign='center';
  ctx.fillText(fmtBRL(total).replace('R$ ','R$'), cx, cy+2);
  ctx.fillStyle='rgba(255,255,255,.4)'; ctx.font='10px Inter';
  ctx.fillText('total no mês', cx, cy+16);

  document.getElementById('donutLegend').innerHTML = data.map(d=>`<span class="legend-item"><span class="legend-dot" style="background:${d.color}"></span>${esc(d.name)} · ${(d.val/total*100).toFixed(0)}%</span>`).join('');
  renderTable('donut', ['Categoria','Valor','%'], data.map(d=>[d.name, fmtBRL(d.val), (d.val/total*100).toFixed(1)+'%']));
}
function renderTable(id, headers, rows){
  const el = document.getElementById('table-'+id); if(!el) return;
  el.innerHTML = `<table class="datatable"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

    ${sorted.length ? sorted.map((d,i)=>debtRow(d,i)).join('') : `<div class="empty"><div class="ic">🧾</div><div class="t">Cadastre suas dívidas para receber a melhor estratégia de quitação</div><button class="btn btn-primary" style="margin-top:14px;" data-action="new-debt">Adicionar dívida</button></div>`}

function debtRow(d,i){
  return `<div class="env-item" data-action="edit-debt" data-id="${d.id}" style="cursor:pointer;">
    <div class="env-ic" style="background:rgba(239,74,74,.12);color:var(--critical);font-weight:800;font-size:14px;">${i+1}º</div>
    <div class="env-body">
      <div class="env-top"><span>${esc(d.name)}</span><span>${money(d.balance)}</span></div>
      <div class="env-meta"><span>Juros ${d.rate}% a.m.</span><span>Mín. ${fmtBRL(d.minPayment)}/mês</span></div>
    </div>
  </div>`;
}
function simulateDebtPayoff(debts, strategy, extra){
  let list = debts.map(d=>({...d}));
  const order = strategy==='avalanche' ? [...list].sort((a,b)=>b.rate-a.rate) : [...list].sort((a,b)=>a.balance-b.balance);
  let months=0, totalInterest=0;
  const byId = Object.fromEntries(list.map(d=>[d.id,d]));
  while(order.some(d=>byId[d.id].balance>0.5) && months<600){
    months++;
    let freedExtra = extra;
    order.forEach(o=>{
      const d = byId[o.id]; if(d.balance<=0) return;
      const interest = d.balance*(d.rate/100);
      totalInterest += interest;
      d.balance += interest;
    });
    for(const o of order){
      const d = byId[o.id]; if(d.balance<=0) continue;
      let pay = Math.min(d.minPayment, d.balance);
      d.balance -= pay;
    }
    for(const o of order){
      const d = byId[o.id]; if(d.balance<=0 || freedExtra<=0) continue;
      const pay = Math.min(freedExtra, d.balance);
      d.balance -= pay; freedExtra -= pay;
    }
  }
  return { months, totalInterest: Math.round(totalInterest) };
}

function attachAttentionTooltip(){
  const canvas = document.getElementById('chartAttn');
  if(!canvas) return;
  let tip;
  canvas.addEventListener('mousemove', e=>{
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX-rect.left;
    const pt = (window._attnPoints||[]).find(p=>x>=p.x0 && x<p.x1);
    if(!tip){ tip=document.createElement('div'); tip.className='tooltip-box'; canvas.parentElement.appendChild(tip); }
    if(pt){
      tip.style.display='block';
      tip.style.left = Math.max(0, (pt.x0+pt.x1)/2 - 55)+'px'; tip.style.top = '2px';
      tip.innerHTML = `<b>${esc(pt.e.name)}</b><br>${fmtBRL(pt.spent)} de ${fmtBRL(pt.e.budget)} (${Math.round(pt.pct*100)}%)`;
    } else if(tip) tip.style.display='none';
  });
  canvas.addEventListener('mouseleave', ()=>{ if(tip) tip.style.display='none'; });
}

function attachChartTooltips(){
  const barsCanvas = document.getElementById('chartBars');
  if(barsCanvas){
    let tip;
    barsCanvas.addEventListener('mousemove', e=>{
      const rect = barsCanvas.getBoundingClientRect();
      const x = e.clientX-rect.left;
      const pt = (window._barPoints||[]).find(p=>Math.abs(x-p.x)<p.w/2);
      if(!tip){ tip=document.createElement('div'); tip.className='tooltip-box'; barsCanvas.parentElement.appendChild(tip); }
      if(pt){
        tip.style.display='block';
        tip.style.left = (pt.x-40)+'px'; tip.style.top = '4px';
        tip.innerHTML = `<b>${pt.d.label}</b><br>Receitas: ${fmtBRL(pt.d.income)}<br>Despesas: ${fmtBRL(pt.d.expense)}`;
      } else if(tip) tip.style.display='none';
    });
    barsCanvas.addEventListener('mouseleave', ()=>{ if(tip) tip.style.display='none'; });
  }
}

/* ---------- event delegation ---------- */
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  switch(action){
    case 'goto':
      state.ui.tab = el.dataset.tab; save(); render(); window.scrollTo(0,0); break;
    case 'toggle-privacy':
      state.privacy.hideValues = !state.privacy.hideValues; save(); render(); break;
    case 'tx-filter':
      state.ui.txFilter = el.dataset.f; render(); break;
    case 'close-modal': closeModal(); break;
    case 'new-tx': openTxForm(); break;
    case 'edit-tx': openTxForm(state.transactions.find(t=>t.id===el.dataset.id)); break;
    case 'delete-tx':
      state.transactions = state.transactions.filter(t=>t.id!==el.dataset.id);
      updateStreak(); save(); closeModal(); render(); toast('Lançamento excluído'); break;
    case 'tx-type': {
      document.getElementById('txType').value = el.dataset.v;
      el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('envFieldWrap').style.display = el.dataset.v==='expense'?'block':'none';
      break;
    }
    case 'new-envelope': openEnvelopeForm(); break;
    case 'edit-envelope': openEnvelopeForm(state.envelopes.find(x=>x.id===el.dataset.id)); break;
    case 'delete-envelope':
      state.envelopes = state.envelopes.filter(x=>x.id!==el.dataset.id);
      state.transactions.forEach(t=>{ if(t.envelopeId===el.dataset.id) t.envelopeId=''; });
      save(); closeModal(); render(); toast('Envelope excluído'); break;
    case 'new-goal': openGoalForm(); break;
    case 'edit-goal': case 'open-goal': openGoalForm(state.goals.find(g=>g.id===el.dataset.id)); break;
    case 'delete-goal':
      state.goals = state.goals.filter(g=>g.id!==el.dataset.id);
      save(); closeModal(); render(); toast('Meta excluída'); break;
    case 'contribute-goal': openContributeForm(el.dataset.id); break;
    case 'new-debt': openDebtForm(); break;
    case 'edit-debt': openDebtForm(state.debts.find(d=>d.id===el.dataset.id)); break;
    case 'delete-debt':
      state.debts = state.debts.filter(d=>d.id!==el.dataset.id);
      save(); closeModal(); render(); toast('Dívida removida'); break;
    case 'debt-strategy': state.ui.debtStrategy = el.dataset.s; render(); break;
    case 'toggle-table': {
      const t = document.getElementById('table-'+el.dataset.t);
      t.style.display = t.style.display==='none' ? 'block' : 'none';
      break;
    }
    case 'save-profile': {
      state.profile.name = document.getElementById('setName').value.trim();
      state.income.monthlyBase = parseFloat(document.getElementById('setIncome').value)||0;
      save(); render(); toast('Perfil salvo');
      break;
    }
    case 'export-data': {
      const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'zenite-backup-'+todayISO()+'.json'; a.click();
      break;
    }
    case 'reset-data': {
      if(confirm('Isso vai apagar TODOS os seus dados financeiros deste dispositivo. Tem certeza?')){
        if(confirm('Confirmação final: não é possível desfazer. Continuar?')){
          localStorage.removeItem(STORAGE_KEY);
          state = defaultState();
          render(); toast('Dados apagados');
        }
      }
      break;
    }
    case 'set-pin': openPinSetup(); break;
    case 'remove-pin': state.security.pin=null; save(); render(); toast('PIN removido'); break;
  }

  // icon/color pickers inside forms
  if(el.dataset.ic && el.closest('#envIconPick')){
    el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active')); el.classList.add('active');
    document.getElementById('envIcon').value = el.dataset.ic;
  }
  if(el.dataset.c && el.closest('#envColorPick')){
    el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active')); el.classList.add('active');
    document.getElementById('envColor').value = el.dataset.c;
  }
  if(el.dataset.ic && el.closest('#goalIconPick')){
    el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active')); el.classList.add('active');
    document.getElementById('goalIcon').value = el.dataset.ic;
  }
});

document.addEventListener('submit', (e)=>{

    e.preventDefault();
    const id = e.target.dataset.id;
    const rec = {
      id: id || uid(),
      type: document.getElementById('txType').value,
      amount: parseFloat(document.getElementById('txAmount').value)||0,
      category: (state.envelopes.find(x=>x.id===document.getElementById('txEnvelope').value)||{}).name || 'Outros',
      envelopeId: document.getElementById('txEnvelope').value,
      date: document.getElementById('txDate').value,
      note: document.getElementById('txNote').value.trim(),
      createdAt: id ? (state.transactions.find(t=>t.id===id)||{}).createdAt || Date.now() : Date.now(),
    };
    if(id){ state.transactions = state.transactions.map(t=>t.id===id?rec:t); }
    else state.transactions.push(rec);
    updateStreak(); save(); closeModal(); render(); toast(id?'Lançamento atualizado':'Lançamento adicionado');
  }
  if(e.target.id==='envForm'){
    e.preventDefault();
    const id = e.target.dataset.id;
    const rec = { id: id||uid(), name: document.getElementById('envName').value.trim(), budget: parseFloat(document.getElementById('envBudget').value)||0, icon: document.getElementById('envIcon').value, color: document.getElementById('envColor').value };
    if(id) state.envelopes = state.envelopes.map(x=>x.id===id?rec:x);
    else state.envelopes.push(rec);
    save(); closeModal(); render(); toast(id?'Envelope atualizado':'Envelope criado');
  }
  if(e.target.id==='goalForm'){
    e.preventDefault();
    const id = e.target.dataset.id;
    const existing = id ? state.goals.find(g=>g.id===id) : null;
    const rec = {
      id: id||uid(), name: document.getElementById('goalName').value.trim(),
      target: parseFloat(document.getElementById('goalTarget').value)||0,
      saved: parseFloat(document.getElementById('goalSaved').value)||0,
      deadline: document.getElementById('goalDeadline').value,
      icon: document.getElementById('goalIcon').value,
      contributions: existing ? existing.contributions : [],
    };
    if(id) state.goals = state.goals.map(g=>g.id===id?rec:g);
    else state.goals.push(rec);
    save(); closeModal(); render(); toast(id?'Meta atualizada':'Meta criada');
  }
  if(e.target.id==='contribForm'){
    e.preventDefault();
    const id = e.target.dataset.id;
    const amount = parseFloat(document.getElementById('contribAmount').value)||0;
    const g = state.goals.find(g=>g.id===id);
    if(g && amount>0){
      g.saved += amount;
      g.contributions = g.contributions||[];
      g.contributions.push({date: todayISO(), amount});
    }
    save(); closeModal(); render(); toast('Aporte registrado 🎉');
  }
  if(e.target.id==='debtForm'){
    e.preventDefault();
    const id = e.target.dataset.id;
    const rec = { id: id||uid(), name: document.getElementById('debtName').value.trim(), balance: parseFloat(document.getElementById('debtBalance').value)||0, rate: parseFloat(document.getElementById('debtRate').value)||0, minPayment: parseFloat(document.getElementById('debtMin').value)||0 };
    if(id) state.debts = state.debts.map(d=>d.id===id?rec:d);
    else { state.debts.push(rec); state.gamification.everHadDebt = true; }
    save(); closeModal(); render(); toast(id?'Dívida atualizada':'Dívida adicionada');
  }
  if(e.target.id==='onboardForm'){
    e.preventDefault();
    const name = document.getElementById('obName').value.trim();
    const income = parseFloat(document.getElementById('obIncome').value)||0;
    state.profile.name = name;
    state.income.monthlyBase = income;
    state.envelopes = generateDefaultEnvelopes(income);
    state.onboarded = true;
    save(); closeModal(); render(); toast(`Bem-vindo(a), ${name}!`);
  }
});

document.addEventListener('input', (e)=>{
  if(e.target.id==='debtExtraInput'){ state.ui.debtExtra = parseFloat(e.target.value)||0; save(); render(); }
});

function handleImport(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed !== 'object') throw new Error('invalid');
      state = Object.assign(defaultState(), parsed);
      save(); render(); toast('Dados importados com sucesso');
    }catch(err){ toast('Arquivo inválido'); }
  };
  reader.readAsText(file);
}

/* ---------- PIN lock ---------- */
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
let pinBuffer = '';
function openPinSetup(){
  pinBuffer = '';
  renderPinScreen('Crie um PIN de 4 dígitos', async (val)=>{
    state.security.pin = await sha256(val);
    save(); document.getElementById('pinScreen').innerHTML=''; render(); toast('PIN ativado');
  }, true);
}
function renderPinScreen(title, onComplete, isSetup){
  const el = document.getElementById('pinScreen');
  el.innerHTML = `<div class="pin-screen">
    <div class="brand-mark" style="width:52px;height:52px;font-size:22px;">Z</div>
    <div style="font-weight:800;font-size:16px;">${title}</div>
    <div class="pin-dots" id="pinDots">${'0000'.split('').map(()=>'<span class="pin-dot"></span>').join('')}</div>
    <div class="pin-pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pin-key" data-n="${n}">${n}</button>`).join('')}
      <div></div><button class="pin-key" data-n="0">0</button><button class="pin-key" data-n="del">⌫</button>
    </div>
    ${!isSetup?'<div class="link-btn" id="pinForgot">Esqueci meu PIN</div>':''}
  </div>`;
  const dots = () => el.querySelectorAll('.pin-dot');
  el.querySelectorAll('.pin-key').forEach(k=>k.addEventListener('click', ()=>{
    if(k.dataset.n==='del'){ pinBuffer = pinBuffer.slice(0,-1); }
    else if(pinBuffer.length<4){ pinBuffer += k.dataset.n; }
    dots().forEach((d,i)=>d.classList.toggle('filled', i<pinBuffer.length));
    if(pinBuffer.length===4){ const v=pinBuffer; setTimeout(()=>{ pinBuffer=''; onComplete(v); },150); }
  }));
  const forgot = document.getElementById('pinForgot');
  if(forgot) forgot.addEventListener('click', ()=>{
    if(confirm('Remover o PIN também não apaga seus dados. Deseja remover o PIN?')){ state.security.pin=null; save(); el.innerHTML=''; boot(); }
  });
}
function checkPin(){
  return new Promise(resolve=>{
    function attempt(){
      renderPinScreen('Digite seu PIN', async (val)=>{
        const hash = await sha256(val);
        if(hash===state.security.pin){ document.getElementById('pinScreen').innerHTML=''; resolve(true); }
        else { toast('PIN incorreto'); attempt(); }
      }, false);
    }
    attempt();
  });
}

/* ---------- boot ---------- */
async function boot(){
  if(state.security.pin){ await checkPin(); }
  updateStreak();
  render();
  if(!state.onboarded){ setTimeout(openOnboarding, 350); }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
boot();
</script>
