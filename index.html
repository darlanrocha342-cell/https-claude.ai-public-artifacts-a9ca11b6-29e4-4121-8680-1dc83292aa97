document.addEventListener('submit', (e)=>{
  if(e.target.id==='txForm'){
    e.preventDefault();
    const id = e.target.dataset.id;
    const rec = {
      id: id || uid(),
      type: document.getElementById('txType').value,
      amount: parseFloat(document.getElementById('txAmount').value)||0,
      category: (state.envelopes.find(x=>x.id===document.getElementById('txEnvelope').value)||{}).name || 'Outros',
      envelopeId: document.getElementById('txEnvelope').value,
      date: document.getElementById('txDate').value,
      note: document.getElementById('txNote').value.trim(),
      createdAt: id ? (state.transactions.find(t=>t.id===id)||{}).createdAt || Date.now() : Date.now(),
    };
    if(id){
      state.transactions = state.transactions.map(t=>t.id===id?rec:t);
      cloudUpdate('transactions', id, { type:rec.type, amount:rec.amount, category:rec.category, envelope_id: rec.envelopeId||null, date:rec.date, note:rec.note });
    } else {
      state.transactions.push(rec);
      cloudInsert('transactions', { id:rec.id, user_id: session?.user?.id, type:rec.type, amount:rec.amount, category:rec.category, envelope_id: rec.envelopeId||null, date:rec.date, note:rec.note });
    }
    updateStreak(); save(); closeModal(); render(); toast(id?'Lançamento atualizado':'Lançamento adicionado');
  }
  if(e.target.id==='envForm'){
    e.preventDefault();
    const id = e.target.dataset.id;
    const existingEnv = id ? state.envelopes.find(x=>x.id===id) : null;
    const rec = {
      id: id||uid(), name: document.getElementById('envName').value.trim(),
      budget: parseFloat(document.getElementById('envBudget').value)||0,
      icon: document.getElementById('envIcon').value, color: document.getElementById('envColor').value,
      fixed: document.getElementById('envFixed').checked,
      autoLaunch: document.getElementById('envAutoLaunch').checked,
      dueDay: clamp(parseInt(document.getElementById('envDueDay').value)||5, 1, 31),
      lastAutoLaunch: existingEnv ? existingEnv.lastAutoLaunch||null : null,
    };
    const cloudPayload = { name:rec.name, budget:rec.budget, icon:rec.icon, color:rec.color, fixed:rec.fixed, auto_launch:rec.autoLaunch, due_day:rec.dueDay, last_auto_launch:rec.lastAutoLaunch };
    if(id){
      state.envelopes = state.envelopes.map(x=>x.id===id?rec:x);
      cloudUpdate('envelopes', id, cloudPayload);
    } else {
      state.envelopes.push(rec);
      cloudInsert('envelopes', { id:rec.id, user_id: session?.user?.id, ...cloudPayload });
    }
    save(); closeModal(); render(); toast(id?'Envelope atualizado':'Envelope criado');
  }
  if(e.target.id==='goalForm'){
    e.preventDefault();
    const id = e.target.dataset.id;
    const existing = id ? state.goals.find(g=>g.id===id) : null;
    const rec = {
      id: id||uid(), name: document.getElementById('goalName').value.trim(),
      target: parseFloat(document.getElementById('goalTarget').value)||0,
      saved: parseFloat(document.getElementById('goalSaved').value)||0,
      deadline: document.getElementById('goalDeadline').value,
      icon: document.getElementById('goalIcon').value,
      contributions: existing ? existing.contributions : [],
    };
    if(id){
      state.goals = state.goals.map(g=>g.id===id?rec:g);
      cloudUpdate('goals', id, { name:rec.name, target:rec.target, saved:rec.saved, deadline: rec.deadline||null, icon:rec.icon });
    } else {
      state.goals.push(rec);
      cloudInsert('goals', { id:rec.id, user_id: session?.user?.id, name:rec.name, target:rec.target, saved:rec.saved, deadline: rec.deadline||null, icon:rec.icon });
    }
    save(); closeModal(); render(); toast(id?'Meta atualizada':'Meta criada');
  }
  if(e.target.id==='contribForm'){
    e.preventDefault();
    const id = e.target.dataset.id;
    const amount = parseFloat(document.getElementById('contribAmount').value)||0;
    const g = state.goals.find(g=>g.id===id);
    if(g && amount>0){
      g.saved += amount;
      g.contributions = g.contributions||[];
      g.contributions.push({date: todayISO(), amount});
      cloudInsert('goal_contributions', { goal_id:id, amount, date: todayISO() });
      cloudUpdate('goals', id, { saved: g.saved });
    }
    save(); closeModal(); render(); toast('Aporte registrado 🎉');
  }
  if(e.target.id==='debtForm'){
    e.preventDefault();
    const id = e.target.dataset.id;
    const total = Math.max(1, parseInt(document.getElementById('debtTotalInst').value)||1);
    const paid = clamp(parseInt(document.getElementById('debtPaidInst').value)||0, 0, total);
    const installmentAmount = parseFloat(document.getElementById('debtInstallmentAmount').value)||0;
    const contractDate = document.getElementById('debtContractDate').value;
    const dueDay = clamp(parseInt(document.getElementById('debtDueDay').value)||5, 1, 31);
    const rec = {
      id: id||uid(),
      name: document.getElementById('debtName').value.trim(),
      category: document.getElementById('debtCategory').value,
      institution: document.getElementById('debtInstitution').value.trim(),
      originalAmount: parseFloat(document.getElementById('debtOriginal').value)||0,
      balance: parseFloat(document.getElementById('debtBalance').value)||0,
      rate: parseFloat(document.getElementById('debtRate').value)||0,
      contractDate,
      firstDueDate: computeFirstDueDate(contractDate, dueDay),
      dueDay,
      totalInstallments: total,
      paidInstallments: paid,
      installmentAmount,
      minPayment: installmentAmount,
      autoDebit: document.getElementById('debtAutoDebit').checked,
      alreadyDebited: document.getElementById('debtAlreadyDebited').checked,
    };
    const cloudPayload = { name:rec.name, category:rec.category, institution:rec.institution, original_amount:rec.originalAmount, balance:rec.balance, rate:rec.rate, contract_date:rec.contractDate||null, first_due_date:rec.firstDueDate||null, due_day:rec.dueDay, total_installments:rec.totalInstallments, paid_installments:rec.paidInstallments, installment_amount:rec.installmentAmount, min_payment:rec.minPayment, auto_debit:rec.autoDebit, already_debited:rec.alreadyDebited };
    if(id){
      state.debts = state.debts.map(d=>d.id===id?rec:d);
      cloudUpdate('debts', id, cloudPayload);
    } else {
      state.debts.push(rec); state.gamification.everHadDebt = true;
      cloudInsert('debts', { id:rec.id, user_id: session?.user?.id, ...cloudPayload });
      cloudUpdateProfile({ ever_had_debt: true });
    }
    save(); closeModal(); render(); toast(id?'Dívida atualizada':'Dívida adicionada');
  }
  if(e.target.id==='onboardForm'){
    e.preventDefault();
    const name = document.getElementById('obName').value.trim();
    const income = parseFloat(document.getElementById('obIncome').value)||0;
    state.profile.name = name;
    state.income.monthlyBase = income;
    state.envelopes = generateDefaultEnvelopes(income);
    state.onboarded = true;
    save(); closeModal(); render(); toast(`Bem-vindo(a), ${name}!`);
    cloudUpdateProfile({ name, monthly_income: income, onboarded: true });
    cloudInsertMany('envelopes', state.envelopes.map(en=>({ id:en.id, user_id: session?.user?.id, name:en.name, icon:en.icon, color:en.color, budget:en.budget })));
  }
});

document.addEventListener('input', (e)=>{
  if(e.target.id==='debtExtraInput'){ state.ui.debtExtra = parseFloat(e.target.value)||0; save(); render(); }
  if(e.target.matches('[data-action="set-custom-color"]')){
    const k = e.target.dataset.k;
    state.appearance.customColors = state.appearance.customColors || {};
    state.appearance.customColors[k] = e.target.value;
    save(); applyCustomColors();
  }
});
document.addEventListener('change', (e)=>{
  if(e.target.matches('[data-action="set-custom-color"]')){
    cloudUpdateProfile({ custom_colors: state.appearance.customColors });
  }
});

function handleImport(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed !== 'object') throw new Error('invalid');
      state = Object.assign(defaultState(), parsed);
      save(); render(); toast('Dados importados com sucesso');
    }catch(err){ toast('Arquivo inválido'); }
  };
  reader.readAsText(file);
}

/* ---------- Portão de acesso ---------- */
function renderAccessGate(){
  document.getElementById('fabAdd').style.display = 'none';
  document.querySelector('.tabbar').style.display = 'none';
  const app = document.getElementById('app');
  app.innerHTML = `
  <div class="auth-screen">
    <div class="brand-mark" style="width:56px;height:56px;">${atlasMarkSVG()}</div>
    <div style="text-align:center;">
      <div style="font-weight:800;font-size:19px;">ATLAS</div>
      <div style="font-size:11.5px;color:var(--text-mute);margin-top:2px;">Acesso restrito — insira a chave de acesso</div>
    </div>
    <div class="auth-card">
      <form id="gateForm">
        <div class="field"><label>Chave de acesso</label><input required type="password" id="gateKeyInput" placeholder="Digite a chave" autocomplete="off" autofocus /></div>
        ${gateError ? `<div class="auth-error">${esc(gateError)}</div>` : ''}
        <button class="btn btn-primary btn-block" type="submit" style="margin-top:14px;" ${gateBusy?'disabled':''}>${gateBusy?'Verificando…':'Entrar'}</button>
      </form>
    </div>
  </div>`;
  document.getElementById('gateForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const val = document.getElementById('gateKeyInput').value;
    if(val === ACCESS_KEY){
      localStorage.setItem(GATE_STORAGE_KEY, '1');
      gateError = '';
      continueBoot();
    } else {
      gateError = 'Chave incorreta.';
      renderAccessGate();
    }
  });
}

/* ---------- Autenticação (nuvem) ---------- */
let authMode = 'login';
let authError = '';
let authBusy = false;

function translateAuthError(msg){
  if(/Invalid login credentials/i.test(msg)) return 'E-mail ou senha incorretos.';
  if(/already registered|already exists|User already registered/i.test(msg)) return 'Este e-mail já tem uma conta. Tente entrar.';
  if(/Password should be|at least 6/i.test(msg)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/Unable to validate email/i.test(msg)) return 'Digite um e-mail válido.';
  return msg || 'Algo deu errado. Tente novamente.';
}

function renderAuthScreen(){
  document.getElementById('fabAdd').style.display = 'none';
  document.querySelector('.tabbar').style.display = 'none';
  const app = document.getElementById('app');
  app.innerHTML = `
  <div class="auth-screen">
    <div class="brand-mark" style="width:56px;height:56px;">${atlasMarkSVG()}</div>
    <div style="text-align:center;">
      <div style="font-weight:800;font-size:19px;">ATLAS</div>
      <div style="font-size:11.5px;color:var(--text-mute);margin-top:2px;">Seu assessor financeiro com inteligência artificial</div>
    </div>
    <div class="auth-card">
      <div class="auth-tabs">
        <div class="auth-tab ${authMode==='login'?'active':''}" data-auth-mode="login">Entrar</div>
        <div class="auth-tab ${authMode==='signup'?'active':''}" data-auth-mode="signup">Criar conta</div>
      </div>
      <form id="authForm">
        <div class="field"><label>E-mail</label><input required type="email" id="authEmail" placeholder="voce@email.com" /></div>
        <div class="field"><label>Senha</label><input required type="password" id="authPassword" minlength="6" placeholder="Mínimo 6 caracteres" /></div>
        ${authError ? `<div class="auth-error">${esc(authError)}</div>` : ''}
        <button class="btn btn-primary btn-block" type="submit" style="margin-top:14px;" ${authBusy?'disabled':''}>${authBusy?'Aguarde…':(authMode==='login'?'Entrar':'Criar conta')}</button>
      </form>
      ${authMode==='login' ? `<div class="link-btn" id="authForgot" style="text-align:center;margin-top:14px;">Esqueci minha senha</div>` : ''}
    </div>
  </div>`;
  document.querySelectorAll('[data-auth-mode]').forEach(el=>el.addEventListener('click', ()=>{
    authMode = el.dataset.authMode; authError=''; renderAuthScreen();
  }));
  const forgot = document.getElementById('authForgot');
  if(forgot) forgot.addEventListener('click', async ()=>{
    const email = document.getElementById('authEmail').value.trim();
    if(!email){ authError='Digite seu e-mail para recuperar a senha.'; renderAuthScreen(); return; }
    try{ await sb.auth.resetPasswordForEmail(email); toast('Enviamos um link de redefinição para seu e-mail'); }
    catch(e){ authError = 'Não foi possível enviar o e-mail de redefinição.'; renderAuthScreen(); }
  });
  document.getElementById('authForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    authBusy = true; authError=''; renderAuthScreen();
    try{
      if(authMode==='signup'){
        const { data, error } = await sb.auth.signUp({ email, password });
        if(error) throw error;
        if(!data.session){
          authBusy=false; authMode='login'; renderAuthScreen();
          toast('Conta criada! Confirme seu e-mail antes de entrar.');
          return;
        }
        session = data.session;
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
        session = data.session;
      }
      await afterLogin();
    }catch(err){
      authBusy = false;
      authError = translateAuthError(err.message);
      renderAuthScreen();
    }
  });
}

async function afterLogin(){
  await syncFromCloud();
  document.querySelector('.tabbar').style.display = '';
  if(state.security.pin){ await checkPin(); }
  updateStreak();
  processAutoDebits();
  processAutoEnvelopeLaunches();
  render();
  if(!state.onboarded){ setTimeout(openOnboarding, 350); }
}

async function logout(){
  if(!confirm('Sair da sua conta ATLAS neste dispositivo?')) return;
  await sb.auth.signOut();
  session = null;
  state = defaultState();
  localStorage.removeItem(STORAGE_KEY);
  authMode = 'login'; authError=''; authBusy=false;
  renderAuthScreen();
}

/* ---------- PIN lock ---------- */
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
let pinBuffer = '';
function openPinSetup(){
  pinBuffer = '';
  renderPinScreen('Crie um PIN de 4 dígitos', async (val)=>{
    state.security.pin = await sha256(val);
    save(); document.getElementById('pinScreen').innerHTML=''; render(); toast('PIN ativado');
    cloudUpdateProfile({ pin_hash: state.security.pin });
  }, true);
}
function renderPinScreen(title, onComplete, isSetup){
  const el = document.getElementById('pinScreen');
  el.innerHTML = `<div class="pin-screen">
    <div class="brand-mark" style="width:52px;height:52px;">${atlasMarkSVG()}</div>
    <div style="font-weight:800;font-size:16px;">${title}</div>
    <div class="pin-dots" id="pinDots">${'0000'.split('').map(()=>'<span class="pin-dot"></span>').join('')}</div>
    <div class="pin-pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pin-key" data-n="${n}">${n}</button>`).join('')}
      <div></div><button class="pin-key" data-n="0">0</button><button class="pin-key" data-n="del">⌫</button>
    </div>
    ${!isSetup?'<div class="link-btn" id="pinForgot">Esqueci meu PIN</div>':''}
  </div>`;
  const dots = () => el.querySelectorAll('.pin-dot');
  el.querySelectorAll('.pin-key').forEach(k=>k.addEventListener('click', ()=>{
    if(k.dataset.n==='del'){ pinBuffer = pinBuffer.slice(0,-1); }
    else if(pinBuffer.length<4){ pinBuffer += k.dataset.n; }
    dots().forEach((d,i)=>d.classList.toggle('filled', i<pinBuffer.length));
    if(pinBuffer.length===4){ const v=pinBuffer; setTimeout(()=>{ pinBuffer=''; onComplete(v); },150); }
  }));
  const forgot = document.getElementById('pinForgot');
  if(forgot) forgot.addEventListener('click', ()=>{
    if(confirm('Remover o PIN também não apaga seus dados. Deseja remover o PIN?')){ state.security.pin=null; save(); el.innerHTML=''; boot(); }
  });
}
function checkPin(){
  return new Promise(resolve=>{
    function attempt(){
      renderPinScreen('Digite seu PIN', async (val)=>{
        const hash = await sha256(val);
        if(hash===state.security.pin){ document.getElementById('pinScreen').innerHTML=''; resolve(true); }
        else { toast('PIN incorreto'); attempt(); }
      }, false);
    }
    attempt();
  });
}

/* ---------- boot ---------- */
async function boot(){
  if(ACCESS_GATE_ENABLED && localStorage.getItem(GATE_STORAGE_KEY) !== '1'){
    renderAccessGate();
    return;
  }
  await continueBoot();
}
async function continueBoot(){
  document.querySelector('.tabbar').style.display = '';
  if(CLOUD_ENABLED){
    const { data:{ session: s0 } } = await sb.auth.getSession();
    session = s0;
    if(session){ await afterLogin(); }
    else { renderAuthScreen(); }
  } else {
    if(state.security.pin){ await checkPin(); }
    updateStreak();
    processAutoDebits();
    processAutoEnvelopeLaunches();
    render();
    if(!state.onboarded){ setTimeout(openOnboarding, 350); }
  }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
boot();
</script>
