<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>ATLAS — Seu assessor financeiro com inteligência artificial</title>
<meta name="description" content="ATLAS: seu assessor financeiro com inteligência artificial. Orçamento inteligente, metas, dívidas e insights automáticos." />
<meta name="theme-color" content="#05070c" />
<meta name="msapplication-TileColor" content="#05070c" />
<meta name="msapplication-TileImage" content="icons/mstile-150x150.png" />
<meta name="msapplication-config" content="browserconfig.xml" />
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* ================= DESIGN SYSTEM ================= */
:root{
  color-scheme: dark;
  --page:#05070c;
  --bg-grad-1: radial-gradient(1200px 600px at 12% -10%, rgba(34,211,238,.14), transparent 60%),
               radial-gradient(1000px 500px at 100% 0%, rgba(124,108,255,.14), transparent 55%),
               radial-gradient(900px 700px at 50% 120%, rgba(16,185,129,.07), transparent 55%);
  --surface: rgba(19,26,41,.55);
  --surface-2: rgba(27,37,56,.65);
  --surface-solid:#121a29;
  --border: rgba(148,180,214,.14);
  --border-soft: rgba(148,180,214,.09);
  --text:#f6f6f8;
  --text-dim:#9aa5b4;
  --text-mute:#63707f;
  --brand-a:#5aa6ff;
  --brand-b:#0052d4;
  --brand-grad: linear-gradient(135deg, var(--brand-a), var(--brand-b));
  --brand-grad-soft: linear-gradient(135deg, rgba(90,166,255,.18), rgba(0,82,212,.14));
  --good:#1fd35a;
  --good-text:#3fe373;
  --warning:#fab219;
  --serious:#ec835a;
  --critical:#ef4a4a;
  --glow-cyan: rgba(34,211,238,.4);
  --card-navy: linear-gradient(165deg, rgba(24,33,53,.78), rgba(9,13,22,.85));
  --scrim-strong: rgba(5,7,12,.92);
  --scrim-clear: rgba(5,7,12,0);
  --sheet-bg:#131316;
  --drawer-bg:#0d1220;
  --tabbar-bg: rgba(15,15,18,.85);
  --insight-text: #dce9ff;
  --insight-text-strong: #ffffff;
  --brand-ink: #a9cdff;
  --c1:#3987e5; --c2:#d95926; --c3:#1baf7a; --c4:#c98500;
  --c5:#d55181; --c6:#2fbf4f; --c7:#9085e9; --c8:#e66767;
  --radius-lg:22px; --radius-md:16px; --radius-sm:11px;
  --shadow-card: 0 10px 40px rgba(0,0,0,.35);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-size: 16px;
}
:root[data-theme="light"]{
  color-scheme: light;
  --page:#f2f4fa;
  --bg-grad-1: radial-gradient(1200px 600px at 12% -10%, rgba(34,211,238,.10), transparent 60%),
               radial-gradient(1000px 500px at 100% 0%, rgba(124,108,255,.10), transparent 55%),
               radial-gradient(900px 700px at 50% 120%, rgba(16,185,129,.05), transparent 55%);
  --surface: rgba(255,255,255,.7);
  --surface-2: rgba(255,255,255,.92);
  --surface-solid:#ffffff;
  --border: rgba(15,23,42,.11);
  --border-soft: rgba(15,23,42,.07);
  --text:#10151f;
  --text-dim:#565f6f;
  --text-mute:#848d9c;
  --shadow-card: 0 10px 30px rgba(15,23,42,.08);
  --card-navy: linear-gradient(165deg, rgba(255,255,255,.92), rgba(238,242,248,.96));
  --scrim-strong: rgba(242,244,250,.92);
  --scrim-clear: rgba(242,244,250,0);
  --sheet-bg:#ffffff;
  --drawer-bg:#ffffff;
  --tabbar-bg: rgba(255,255,255,.85);
  --insight-text: #1b3c6e;
  --insight-text-strong: #0d1f3d;
  --brand-ink: #0052d4;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{height:100%;}
body{
  margin:0; background: var(--page); background-image: var(--bg-grad-1); background-attachment: fixed;
  color: var(--text); font-family:"Inter", -apple-system, BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
h1,h2,h3,.num{ font-family:"Inter Tight","Inter",sans-serif; letter-spacing:-.02em; }
button{ font-family:inherit; }
::selection{ background: rgba(90,166,255,.35); }
a{ color:inherit; text-decoration:none; }
input,select,textarea{ font-family:inherit; }

/* scrollbar */
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.12); border-radius:8px; }

/* layout shells */
#app{ max-width:560px; margin:0 auto; min-height:100vh; padding-bottom: calc(92px + var(--safe-bottom)); position:relative; overflow-x:hidden; }
.topbar{
  position:sticky; top:0; z-index:20; padding: calc(16px + var(--safe-top)) 18px 12px;
  background: linear-gradient(to bottom, var(--scrim-strong) 60%, var(--scrim-clear));
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.brand{ display:flex; align-items:center; gap:9px; }
.brand-mark{ width:30px; height:30px; border-radius:9px; background:#05070c; display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow:0 4px 16px rgba(0,102,255,.35);}
.brand-mark svg{ width:74%; height:74%; }
.brand-name{ font-weight:800; font-size:15px; letter-spacing:.02em; }
.topbar-actions{ display:flex; align-items:center; gap:8px; }
.icon-btn{
  width:38px; height:38px; border-radius:12px; border:1px solid var(--border); background: var(--surface);
  color: var(--text-dim); display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition: transform .15s ease, background .15s ease, color .15s ease;
}
.icon-btn:active{ transform: scale(.92); }
.icon-btn.active{ color: var(--good-text); background: rgba(31,211,90,.12); border-color: rgba(31,211,90,.35); }

main{ padding: 6px 18px 24px; }
.screen{ display:flex; flex-direction:column; gap:16px; animation: fadeUp .35s ease; }
@keyframes fadeUp{ from{ opacity:0; transform: translateY(8px);} to{ opacity:1; transform:none; } }

/* cards */
.card{
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg);
  padding:18px; box-shadow: var(--shadow-card); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  position:relative; overflow:hidden;
}
.card.glow{
  background: var(--card-navy);
  border-color: rgba(94,234,212,.22);
  box-shadow: 0 0 0 1px rgba(34,211,238,.10), 0 0 70px -18px var(--glow-cyan), 0 24px 60px rgba(0,0,0,.55);
}
.card.glow::before{
  content:""; position:absolute; inset:-1px; border-radius:inherit; padding:1px;
  background: linear-gradient(135deg, rgba(34,211,238,.75), rgba(90,166,255,.4), rgba(34,211,238,.08) 70%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude; pointer-events:none;
}
.card-title{ font-size:13px; color: var(--text-dim); font-weight:600; letter-spacing:.02em; margin:0 0 4px; }
.card-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.section-title{ font-size:19px; font-weight:800; margin: 4px 2px 2px; display:flex; align-items:center; justify-content:space-between; }
.section-sub{ font-size:12.5px; color: var(--text-mute); margin: -8px 2px 0; }
.link-btn{ font-size:12.5px; font-weight:700; color: var(--brand-b); cursor:pointer; }

/* card header with icon badge, à la referência */
.card-head{ display:flex; align-items:center; gap:10px; }
.card-head .ic{ width:30px; height:30px; border-radius:10px; background: rgba(34,211,238,.12); border:1px solid rgba(34,211,238,.28); color:#5eead4; display:flex; align-items:center; justify-content:center; flex:0 0 auto; box-shadow: 0 0 16px rgba(34,211,238,.18); }
.card-head .t{ font-weight:800; font-size:14.5px; letter-spacing:.01em; }

/* hero balance */
.hero{ padding:22px 20px 20px; }
.hero-label{ font-size:12.5px; color: var(--text-dim); font-weight:600; }
.hero-amount{ font-size:38px; font-weight:800; margin:6px 0 14px; line-height:1.05; }
.hero-amount.neg{ color: var(--critical); }
.dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }

/* linha de estatísticas com divisores, à la referência */
.divider-stats{ display:flex; border:1px solid rgba(148,180,214,.16); border-radius: var(--radius-md); overflow:hidden; background: rgba(255,255,255,.02); }
.divider-stats .dstat{ flex:1; padding:12px 6px 12px 12px; min-width:0; }
.divider-stats .dstat + .dstat{ border-left:1px solid rgba(148,180,214,.16); }
.divider-stats .dstat .lbl{ display:flex; align-items:center; gap:5px; font-size:9.5px; color:var(--text-mute); font-weight:700; text-transform:uppercase; letter-spacing:.02em; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.divider-stats .dstat .val{ font-size:13px; font-weight:800; line-height:1.25; }
.divider-stats .dstat .sub2{ font-size:9.5px; color:var(--text-mute); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.divider-stats .dstat .lbl svg{ flex:0 0 auto; }

/* linha secundária, mais discreta, separada por uma linha fina */
.legend-row{ display:flex; margin-top:14px; padding-top:14px; border-top:1px solid rgba(148,180,214,.14); }
.legend-row .lstat{ flex:1; padding:0 10px; min-width:0; }
.legend-row .lstat:first-child{ padding-left:0; }
.legend-row .lstat:not(:first-child){ border-left:1px solid rgba(148,180,214,.14); }
.legend-row .lstat .lbl{ display:flex; align-items:center; gap:5px; font-size:9.5px; color:var(--text-mute); font-weight:700; text-transform:uppercase; letter-spacing:.02em; margin-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.legend-row .lstat .val{ font-size:13px; font-weight:800; line-height:1.25; }
.legend-row .lstat .sub2{ font-size:9px; color:var(--text-mute); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* stat grid */
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

/* progress bars */
.bar-track{ height:8px; border-radius:99px; background: rgba(255,255,255,.08); overflow:visible; position:relative; }
.bar-track.lg{ height:10px; }
.bar-fill{ height:100%; border-radius:99px; transition: width .5s cubic-bezier(.2,.8,.2,1); position:relative; }
.bar-fill.good{ background: linear-gradient(90deg,#1fd35a,#2fbf4f); box-shadow: 0 0 8px rgba(31,211,90,.4); }
.bar-fill.warning{ background: linear-gradient(90deg,#fab219,#e89a10); box-shadow: 0 0 10px rgba(250,178,25,.45); }
.bar-fill.serious{ background: linear-gradient(90deg,#ec835a,#e06a3d); box-shadow: 0 0 10px rgba(236,131,90,.45); }
.bar-fill.critical{ background: linear-gradient(90deg,#ef4a4a,#d03b3b); box-shadow: 0 0 12px rgba(239,74,74,.55); }
.bar-fill.brand{ background: var(--brand-grad); box-shadow: 0 0 10px rgba(90,166,255,.4); }

/* stat pills */
.hero-pill{ background: var(--surface-2); border:1px solid var(--border-soft); border-radius:12px; padding:10px 12px; }
.hero-pill .lbl{ font-size:9.5px; font-weight:800; letter-spacing:.04em; color:var(--text-mute); text-transform:uppercase; margin-bottom:4px; }
.hero-pill .val{ font-size:15px; font-weight:800; }

/* toggle switch */
.toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; }
.toggle-row .lbl{ font-size:13px; font-weight:700; }
.switch{ position:relative; display:inline-block; width:44px; height:26px; flex:0 0 auto; }
.switch input{ opacity:0; width:0; height:0; position:absolute; }
.switch .track{ position:absolute; inset:0; background:var(--surface-2); border:1px solid var(--border); border-radius:99px; transition:.2s; cursor:pointer; }
.switch .track:before{ content:""; position:absolute; width:18px; height:18px; left:3px; top:2.5px; background:#fff; border-radius:50%; transition:.2s; }
.switch input:checked + .track{ background:var(--brand-grad); border-color:transparent; }
.switch input:checked + .track:before{ transform:translateX(18px); }

/* envelopes */
.env-item{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border-soft); }
.env-item:last-child{ border-bottom:none; }
.env-ic{ width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.goal-ic{ width:44px; height:44px; border-radius:13px; background: var(--brand-grad-soft); color:var(--brand-ink); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.env-body{ flex:1; min-width:0; }
.env-top{ display:flex; justify-content:space-between; font-size:13.5px; font-weight:700; margin-bottom:6px; gap:8px; }
.env-top .pct{ font-weight:700; font-size:12px; }
.env-meta{ font-size:11px; color: var(--text-mute); margin-top:4px; display:flex; justify-content:space-between; }

/* chips */
.chip{ display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:99px; background: var(--surface-2); border:1px solid var(--border-soft); font-size:12px; font-weight:700; color:var(--text-dim); white-space:nowrap; }
.chip.on{ background: rgba(90,166,255,.16); border-color: rgba(90,166,255,.4); color:var(--brand-ink); }
.chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
.chip-row::-webkit-scrollbar{ display:none; }
.badge{ font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:99px; text-transform:uppercase; letter-spacing:.03em; border:1px solid transparent; }
.badge.good{ background: rgba(31,211,90,.13); color: var(--good-text); border-color: rgba(31,211,90,.35); }
.badge.warning{ background: rgba(250,178,25,.13); color: var(--warning); border-color: rgba(250,178,25,.4); box-shadow: 0 0 10px rgba(250,178,25,.2); }
.badge.serious{ background: rgba(236,131,90,.15); color: var(--serious); border-color: rgba(236,131,90,.4); box-shadow: 0 0 10px rgba(236,131,90,.2); }
.badge.critical{ background: rgba(239,74,74,.15); color: var(--critical); border-color: rgba(239,74,74,.45); box-shadow: 0 0 12px rgba(239,74,74,.3); }
.badge.neutral{ background: rgba(255,255,255,.08); color: var(--text-dim); border-color: rgba(255,255,255,.12); }

/* insight */
.insight{ display:flex; gap:12px; padding:14px; border-radius: var(--radius-md); background: var(--brand-grad-soft); border:1px solid rgba(90,166,255,.25); }
.insight .ic{ width:30px; height:30px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.insight .tx{ font-size:13px; line-height:1.45; color:var(--insight-text); }
.insight .tx b{ color:var(--insight-text-strong); }

/* transaction list */
.tx-item{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border-soft); cursor:pointer; }
.tx-item:last-child{ border-bottom:none; }
.tx-ic{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:16px; flex:0 0 auto; background: var(--surface-2); }
.tx-body{ flex:1; min-width:0; }
.tx-name{ font-size:13.5px; font-weight:700; }
.tx-meta{ font-size:11px; color: var(--text-mute); margin-top:2px; }
.tx-amt{ font-size:14px; font-weight:800; white-space:nowrap; }
.tx-amt.in{ color: var(--good-text); }
.tx-amt.out{ color: var(--text); }
.day-sep{ font-size:11px; font-weight:700; color: var(--text-mute); text-transform:uppercase; letter-spacing:.04em; padding:14px 2px 2px; }

/* buttons */
.btn{ border:none; border-radius:14px; padding:13px 18px; font-weight:700; font-size:14px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition: transform .12s ease, filter .12s ease; }
.btn:active{ transform: scale(.97); }
.btn-primary{ background: var(--brand-grad); color:#0a0a0c; width:100%; box-shadow:0 8px 24px rgba(90,166,255,.28); }
.btn-ghost{ background: var(--surface-2); color:var(--text); border:1px solid var(--border); }
.btn-block{ width:100%; }
.btn-sm{ padding:9px 14px; font-size:12.5px; border-radius:11px; }
.btn-danger{ background: rgba(239,74,74,.14); color:#ff8080; border:1px solid rgba(239,74,74,.3); }
.fab{
  position:fixed; right:calc(50% - 264px); bottom: calc(96px + var(--safe-bottom)); z-index:30;
  width:58px; height:58px; border-radius:50%; background: var(--brand-grad); border:none; color:#0a0a0c;
  font-size:26px; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 30px rgba(90,166,255,.45);
  cursor:pointer;
}
@media (max-width:576px){ .fab{ right:20px; } }

/* bottom nav */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:25; display:flex; justify-content:center;
  padding-bottom: var(--safe-bottom);
  background: var(--tabbar-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top:1px solid var(--border);
}
.tabbar-inner{
  width:100%; max-width:560px; display:flex; padding:9px 6px 8px;
}
.tab-btn{ flex:1; background:none; border:none; color: var(--text-mute); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:700; padding:5px 2px; cursor:pointer; }
.tab-btn .ic{ font-size:19px; line-height:1; }
.tab-btn.active{ color:var(--text); }
.tab-btn.active .ic{ filter: drop-shadow(0 0 10px rgba(90,166,255,.6)); }

/* forms & modal */
.modal-backdrop{ position:fixed; inset:0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); z-index:50; display:none; align-items:flex-end; justify-content:center; }
.modal-backdrop.open{ display:flex; animation: fadeIn .2s ease; }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.modal-sheet{
  width:100%; max-width:560px; max-height:88vh; overflow-y:auto; background: var(--sheet-bg); border:1px solid var(--border);
  border-radius: 24px 24px 0 0; padding: 16px 18px calc(24px + var(--safe-bottom)); animation: slideUp .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideUp{ from{ transform: translateY(30px); opacity:.6; } to{ transform:none; opacity:1; } }
.modal-handle{ width:38px; height:4px; background: rgba(255,255,255,.18); border-radius:99px; margin:2px auto 14px; }
.modal-title{ font-size:18px; font-weight:800; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
.field{ margin-bottom:13px; }
.field label{ font-size:12px; font-weight:700; color: var(--text-dim); display:block; margin-bottom:6px; }
.field input, .field select, .field textarea{
  width:100%; background: var(--surface-2); border:1px solid var(--border); color: var(--text);
  border-radius:12px; padding:12px 13px; font-size:14.5px; outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color: rgba(90,166,255,.55); }
.field-row{ display:flex; gap:10px; }
.field-row .field{ flex:1; }
.seg{ display:flex; background: var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:3px; gap:3px; }
.seg button{ flex:1; border:none; background:none; color: var(--text-dim); padding:9px 6px; border-radius:9px; font-weight:700; font-size:12.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.seg button.active{ background: var(--brand-grad); color:#0a0a0c; }
.icon-pick{ display:flex; flex-wrap:wrap; gap:8px; }
.icon-pick button{ width:40px; height:40px; border-radius:11px; border:1px solid var(--border); background: var(--surface-2); color: var(--text-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; }
.icon-pick button.active{ border-color: var(--brand-a); background: rgba(90,166,255,.18); color:var(--brand-ink); }
.color-pick{ display:flex; flex-wrap:wrap; gap:8px; }
.color-pick button{ width:28px; height:28px; border-radius:50%; border:2px solid transparent; cursor:pointer; }
.color-pick button.active{ border-color: var(--text); box-shadow: 0 0 0 2px var(--surface-solid); }
.theme-row{ display:flex; align-items:center; gap:14px; padding:12px; border-radius:14px; background:var(--surface-2); border:1px solid var(--border-soft); margin-bottom:10px; }
.theme-row .t{ font-size:14px; font-weight:700; }
.theme-row .d{ font-size:11.5px; color:var(--text-mute); margin-top:1px; }
.theme-swatch{ -webkit-appearance:none; appearance:none; width:46px; height:46px; border-radius:13px; border:1px solid var(--border); padding:0; cursor:pointer; background:var(--surface); flex:0 0 auto; }
.theme-swatch::-webkit-color-swatch-wrapper{ padding:2px; }
.theme-swatch::-webkit-color-swatch{ border:none; border-radius:11px; }
.theme-swatch::-moz-color-swatch{ border:none; border-radius:11px; }

/* empty state */
.empty{ text-align:center; padding:40px 16px; color: var(--text-mute); }
.empty .ic{ font-size:34px; margin-bottom:10px; }

.pin-key{ width:64px; height:64px; border-radius:50%; border:1px solid var(--border); background: var(--surface-2); color:var(--text); font-size:20px; font-weight:700; cursor:pointer; }

.drawer-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter: blur(3px); z-index:60; display:none; }

.drawer-panel{
  position:fixed; top:0; bottom:0; left:0; width:82%; max-width:300px; z-index:61;

function progressRing(pct, size, strokeW, color, innerHTML){
  const r = (size - strokeW) / 2, c = size / 2;

  const offset = circumference * (1 - clamp(pct, 0, 1));
  return `<div style="position:relative;width:${size}px;height:${size}px;flex:0 0 auto;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg);position:absolute;inset:0;">

      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${strokeW}" stroke-linecap="round"

        style="transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 4px ${color}99);"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">${innerHTML}</div>

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const s = Object.assign(defaultState(), parsed);
    s.debts = (s.debts||[]).map(debtNormalize);
    return s;
  }catch(e){ return defaultState(); }
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

/* ---------- sincronização com Supabase ----------
   O Supabase é a fonte de verdade quando CLOUD_ENABLED está ligado.
   localStorage continua sendo usado como cache local (leitura instantânea,
   funciona offline para visualizar dados já carregados). */
function stateFromCloud(profile, envelopes, transactions, goals, contributions, debts){
  const s = defaultState();
  s.onboarded = !!(profile && profile.onboarded);
  s.profile = { name: (profile && profile.name) || '', currency: (profile && profile.currency) || 'BRL', createdAt: (profile && profile.created_at || '').slice(0,10) || todayISO() };
  s.security = { pin: (profile && profile.pin_hash) || null };
  s.privacy = { hideValues: !!(profile && profile.hide_values) };
  s.appearance = { theme: (profile && profile.theme) || 'dark', customColors: (profile && profile.custom_colors) || {} };
  s.income = { monthlyBase: Number(profile && profile.monthly_income) || 0 };
  s.envelopes = envelopes.map(e=>({ id:e.id, name:e.name, icon:e.icon, color:e.color, budget:Number(e.budget)||0, fixed:!!e.fixed, autoLaunch:!!e.auto_launch, dueDay:e.due_day||5, lastAutoLaunch:e.last_auto_launch||null }));
  s.transactions = transactions.map(t=>({ id:t.id, type:t.type, amount:Number(t.amount)||0, category:t.category, envelopeId:t.envelope_id||'', date:t.date, note:t.note||'', createdAt: new Date(t.created_at).getTime() }));
  const contribByGoal = {};
  contributions.forEach(c=>{ (contribByGoal[c.goal_id] = contribByGoal[c.goal_id]||[]).push({ date:c.date, amount:Number(c.amount)||0 }); });
  s.goals = goals.map(g=>({ id:g.id, name:g.name, icon:g.icon, target:Number(g.target)||0, saved:Number(g.saved)||0, deadline:g.deadline||'', contributions: contribByGoal[g.id]||[] }));
  s.debts = debts.map(d=>debtNormalize({
    id:d.id, name:d.name, balance:Number(d.balance)||0, rate:Number(d.rate)||0,
    minPayment:Number(d.min_payment)||0, category:d.category, institution:d.institution,
    originalAmount: d.original_amount!=null ? Number(d.original_amount) : undefined,
    contractDate: d.contract_date||'', firstDueDate: d.first_due_date||'', dueDay: d.due_day||undefined,
    totalInstallments: d.total_installments||undefined, paidInstallments: d.paid_installments||0,
    installmentAmount: d.installment_amount!=null ? Number(d.installment_amount) : undefined,
    autoDebit: !!d.auto_debit, alreadyDebited: d.already_debited!=null ? !!d.already_debited : undefined,
  }));
  s.gamification = { lastActiveDate: (profile && profile.last_active_date) || null, streak: 0, everHadDebt: !!(profile && profile.ever_had_debt) };
  s.ui = { tab:'dashboard', unlocked:false };
  return s;
}

async function syncFromCloud(){
  const uidAuth = session.user.id;
  const [profileRes, envRes, txRes, goalsRes, contribRes, debtsRes] = await Promise.all([
    sb.from('profiles').select('*').eq('id', uidAuth).maybeSingle(),
    sb.from('envelopes').select('*').eq('user_id', uidAuth).order('created_at'),
    sb.from('transactions').select('*').eq('user_id', uidAuth).order('date', {ascending:false}),
    sb.from('goals').select('*').eq('user_id', uidAuth).order('created_at'),
    sb.from('goal_contributions').select('*'), // RLS já filtra pelas metas do usuário
    sb.from('debts').select('*').eq('user_id', uidAuth).order('created_at'),
  ]);
  state = stateFromCloud(profileRes.data, envRes.data||[], txRes.data||[], goalsRes.data||[], contribRes.data||[], debtsRes.data||[]);
  save();
  applyTheme(); applyCustomColors();
}

async function cloudUpdateProfile(patch){
  if(!CLOUD_ENABLED || !session) return;
  try{ await sb.from('profiles').update(patch).eq('id', session.user.id); }
  catch(e){ console.warn('falha ao sincronizar perfil', e); }
}
async function cloudInsert(table, row){
  if(!CLOUD_ENABLED || !session) return;
  try{ const { error } = await sb.from(table).insert(row); if(error) throw error; }
  catch(e){ console.warn('falha ao sincronizar (insert)', table, e); toast('Salvo neste dispositivo. Falha ao sincronizar com a nuvem.'); }
}
async function cloudInsertMany(table, rows){
  if(!CLOUD_ENABLED || !session || !rows.length) return;
  try{ const { error } = await sb.from(table).insert(rows); if(error) throw error; }
  catch(e){ console.warn('falha ao sincronizar (insert em lote)', table, e); }
}
async function cloudUpdate(table, id, patch){
  if(!CLOUD_ENABLED || !session) return;
  try{ const { error } = await sb.from(table).update(patch).eq('id', id); if(error) throw error; }
  catch(e){ console.warn('falha ao sincronizar (update)', table, e); toast('Salvo neste dispositivo. Falha ao sincronizar com a nuvem.'); }
}
async function cloudDelete(table, id){
  if(!CLOUD_ENABLED || !session) return;
  try{ const { error } = await sb.from(table).delete().eq('id', id); if(error) throw error; }
  catch(e){ console.warn('falha ao sincronizar (delete)', table, e); }
}

/* ---------- helpers ---------- */
const fmtBRL = (v) => (v<0? '-':'') + 'R$ ' + Math.abs(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
function money(v, cls=''){ return `<span class="money ${state.privacy.hideValues?'blurred':''} ${cls}">${fmtBRL(v)}</span>`; }
function monthKey(d=new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function daysInMonth(d=new Date()){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function fmtDate(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}); }
function fmtDateLong(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}); }
function monthLabel(offset=0){
  const d = new Date(); d.setMonth(d.getMonth()+offset);
  return d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
}
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

function txForMonth(offset=0){
  const key = monthKey(new Date(new Date().setMonth(new Date().getMonth()+offset)));
  return state.transactions.filter(t => t.date.slice(0,7) === key);
}
function sumBy(list, type){ return list.filter(t=>t.type===type).reduce((s,t)=>s+t.amount,0); }

function envelopeSpent(envId, offset=0){
  return txForMonth(offset).filter(t=>t.type==='expense' && t.envelopeId===envId).reduce((s,t)=>s+t.amount,0);
}
function statusForPct(pct){
  if(pct >= 1) return 'critical';
  if(pct >= .9) return 'serious';
  if(pct >= .8) return 'warning';
  return 'good';
}
function statusLabel(s){ return {good:'No ritmo', warning:'Atenção', serious:'Quase no limite', critical:'Estourou'}[s]; }

/* ---------- score & recomendações ---------- */
function computeMetrics(){
  const thisMonth = txForMonth(0);
  const income = sumBy(thisMonth,'income') + (state.income.monthlyBase||0);
  const expenses = sumBy(thisMonth,'expense');
  const savings = income - expenses;
  const savingsRate = income>0 ? savings/income : 0;
  const totalBudget = state.envelopes.reduce((s,e)=>s+ (e.budget||0), 0);
  const spentAll = state.envelopes.reduce((s,e)=>s+envelopeSpent(e.id,0),0);
  const now = new Date();
  const dim = daysInMonth(now);
  const dayOfMonth = now.getDate();
  const daysLeft = Math.max(1, dim - dayOfMonth + 1);
  const availableToday = Math.max(0, totalBudget - spentAll) / daysLeft;
  const overBudgetCount = state.envelopes.filter(e => e.budget>0 && envelopeSpent(e.id,0) >= e.budget).length;
  const budgetAdherence = state.envelopes.length ? 1 - clamp(overBudgetCount/state.envelopes.length,0,1) : 1;

  let goalOnTrackRatio = 1;
  if(state.goals.length){
    let onTrack = 0;
    state.goals.forEach(g=>{
      const needed = requiredMonthly(g);
      const gotThisMonth = (g.contributions||[]).filter(c=>c.date.slice(0,7)===monthKey()).reduce((s,c)=>s+c.amount,0);
      if(needed<=0 || gotThisMonth >= needed*0.9) onTrack++;
    });
    goalOnTrackRatio = onTrack/state.goals.length;
  }

  const streak = state.gamification.streak||0;
  const savingsScore = clamp(savingsRate/0.2,0,1) * 40;
  const budgetScore = budgetAdherence * 30;
  const goalScore = goalOnTrackRatio * 20;
  const streakScore = clamp(streak/30,0,1) * 10;
  const score = Math.round(savingsScore+budgetScore+goalScore+streakScore);

  return { income, expenses, savings, savingsRate, totalBudget, spentAll, daysLeft, dayOfMonth, dim, availableToday, score, overBudgetCount };
}
function computeFixedVariable(){
  const thisMonth = txForMonth(0).filter(t=>t.type==='expense');
  let fixed=0, variable=0;
  thisMonth.forEach(t=>{
    const env = state.envelopes.find(e=>e.id===t.envelopeId);
    if(env && env.fixed) fixed += t.amount; else variable += t.amount;
  });
  return { fixed: round2(fixed), variable: round2(variable) };
}

function requiredMonthly(goal){
  if(!goal.deadline) return 0;
  const remaining = Math.max(0, goal.target - goal.saved);
  const months = Math.max(1, monthsBetween(todayISO(), goal.deadline));
  return remaining / months;
}
function monthsBetween(iso1, iso2){
  const a = new Date(iso1+'T00:00:00'), b = new Date(iso2+'T00:00:00');
  return Math.max(0, (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()) + (b.getDate()>=a.getDate()?0:-1)+1);
}
function goalMonthlyAvgContribution(goal){
  const c = goal.contributions||[];
  if(!c.length) return 0;
  const byMonth = {};
  c.forEach(x=>{ byMonth[x.date.slice(0,7)] = (byMonth[x.date.slice(0,7)]||0) + x.amount; });
  const months = Object.keys(byMonth);
  const total = months.reduce((s,m)=>s+byMonth[m],0);
  return total / months.length;
}

/* ---------- insights (motor de recomendações) ---------- */
function computeInsights(){
  const insights = [];
  const m = computeMetrics();

  if(m.income>0 && m.savings<0){
    insights.push({icKey:'alert', sev:'critical', text:`Você está gastando <b>${fmtBRL(Math.abs(m.savings))}</b> a mais do que ganha este mês. Vamos revisar seu orçamento antes que isso vire dívida.`});
  } else if(m.income>0){
    if(m.savingsRate>=0.2) insights.push({icKey:'piggy', sev:'good', text:`Disciplina impecável: você está economizando <b>${(m.savingsRate*100).toFixed(0)}%</b> da sua renda este mês.`});
    else if(m.savingsRate>=0.1) insights.push({icKey:'piggy', sev:'good', text:`Boa taxa de economia (<b>${(m.savingsRate*100).toFixed(0)}%</b>). Tente chegar a 20% reduzindo uma categoria variável.`});
    else insights.push({icKey:'bulb', sev:'neutral', text:`Sua taxa de economia está em <b>${(m.savingsRate*100).toFixed(0)}%</b>. Pequenos cortes em lazer ou assinaturas já fazem diferença.`});
  }

  state.envelopes.forEach(env=>{
    const spentNow = envelopeSpent(env.id,0);
    const hist = [1,2,3].map(o=>envelopeSpent(env.id,-o));
    const validHist = hist.filter(h=>h>0);
    if(validHist.length>=1){
      const avg = validHist.reduce((s,v)=>s+v,0)/validHist.length;
      const projected = m.dayOfMonth>0 ? spentNow/m.dayOfMonth*m.dim : spentNow;
      if(avg>0 && projected > avg*1.2){
        const pctAbove = Math.round((projected/avg-1)*100);
        const yearlyIfReduced = Math.round(projected*0.15*12);
        insights.push({icKey:'chart', sev:'warning', text:`Gasto com <b>${esc(env.name)}</b> está ${pctAbove}% acima da sua média. Reduzindo 15%, você economizaria cerca de <b>${fmtBRL(yearlyIfReduced)}</b>/ano.`});
      }
    }
    if(env.budget>0){
      const pct = spentNow/env.budget;
      const overBy = spentNow - env.budget;
      if(pct>=0.9 && pct<1) insights.push({icKey:'alert', sev:'warning', text:`Orçamento de <b>${esc(env.name)}</b> já está em ${(pct*100).toFixed(0)}%. Faltam ${fmtBRL(Math.max(0,env.budget-spentNow))} até o limite.`});
      else if(pct>=1 && overBy<=0.005) insights.push({icKey:'alert', sev:'warning', text:`Você atingiu exatamente o limite do orçamento de <b>${esc(env.name)}</b>.`});
      else if(overBy>0.005) insights.push({icKey:'alert', sev:'critical', text:`Você estourou o orçamento de <b>${esc(env.name)}</b> em ${fmtBRL(overBy)}.`});
    }
  });

  state.goals.forEach(g=>{
    const needed = requiredMonthly(g);
    const avg = goalMonthlyAvgContribution(g);
    if(needed>0){
      if(avg >= needed*1.15){
        const monthsAhead = Math.max(1, Math.round((avg/needed - 1) * monthsBetween(todayISO(), g.deadline)));
        insights.push({icKey:'chart', sev:'good', text:`Meta <b>${esc(g.name)}</b> está adiantada! No ritmo atual, você chega até ${monthsAhead} mês(es) antes do prazo.`});
      } else if(avg>0 && avg < needed*0.7){
        insights.push({icKey:'clock', sev:'warning', text:`Meta <b>${esc(g.name)}</b> está atrasada. Você precisa aportar em média ${fmtBRL(needed)}/mês para chegar no prazo.`});
      }
    }
  });

  if(!insights.length){
    insights.push({icKey:'bulb', sev:'neutral', text:'Continue registrando seus lançamentos — quanto mais dados, mais precisos ficam os seus insights.'});
  }
  return insights.slice(0,4);
}

/* ---------- gamificação ---------- */
function updateStreak(){
  const dates = [...new Set(state.transactions.map(t=>t.date))].sort();
  if(!dates.length){ state.gamification.streak = 0; return; }
  const set = new Set(dates);
  let streak = 0;
  let cursor = new Date();
  if(!set.has(todayISO())){
    cursor.setDate(cursor.getDate()-1);
  }
  while(true){
    const iso = cursor.toISOString().slice(0,10);
    if(set.has(iso)){ streak++; cursor.setDate(cursor.getDate()-1); } else break;
  }
  state.gamification.streak = streak;
}
function totalXP(){
  const txXP = state.transactions.length * 10;
  const goalXP = state.goals.filter(g=>g.saved>=g.target).length * 150;
  const streakXP = (state.gamification.streak||0) * 5;
  return txXP+goalXP+streakXP;
}
function levelInfo(){
  const xp = totalXP();
  const level = Math.floor(Math.sqrt(xp/50)) + 1;
  const currentFloor = 50*(level-1)*(level-1);
  const nextFloor = 50*level*level;
  const pct = clamp((xp-currentFloor)/(nextFloor-currentFloor||1),0,1);
  return {xp, level, pct, next: nextFloor};
}
function computeBadges(){
  const b = [];
  const push=(unlocked,ic,name,desc)=>b.push({unlocked,ic,name,desc});
  push(state.transactions.length>=1,'🌱','Primeiro Registro','Adicione seu primeiro lançamento');
  push((state.gamification.streak||0)>=7,'🔥','Uma Semana de Foco','7 dias seguidos registrando gastos');
  push((state.gamification.streak||0)>=30,'💎','Um Mês de Disciplina','30 dias seguidos registrando gastos');
  push(state.envelopes.length>0 && state.envelopes.every(e=>e.budget<=0 || envelopeSpent(e.id,0) < e.budget*0.9),'🛡️','Orçamento Sob Controle','Nenhuma categoria acima de 90%');
  push(state.goals.some(g=>g.saved>=g.target),'🏆','Meta Conquistada','Complete sua primeira meta');
  push(state.gamification.everHadDebt && (state.debts.length===0 || state.debts.every(d=>d.balance<=0)),'🕊️','Livre de Dívidas','Quite todas as suas dívidas');
  push(computeMetrics().savingsRate>=0.2,'📈','Economista','20%+ de taxa de economia em um mês');
  return b;
}

function weekdaySpend(days){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-(days-1));
  const cutoffISO = cutoff.toISOString().slice(0,10);
  const labels = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const labelsLong = ['domingos','segundas-feiras','terças-feiras','quartas-feiras','quintas-feiras','sextas-feiras','sábados'];
  const sums = [0,0,0,0,0,0,0];
  state.transactions.forEach(t=>{
    if(t.type==='expense' && t.date>=cutoffISO) sums[new Date(t.date+'T00:00:00').getDay()] += t.amount;
  });
  return { labels, labelsLong, sums };
}
function deltaBadge(current, previous, invert){
  if(!previous) return '';
  const pct = (current-previous)/Math.abs(previous)*100;
  if(Math.abs(pct) < 1) return `<span class="badge neutral">≈ estável</span>`;
  const up = pct >= 0;
  const good = invert ? !up : up;
  const arrow = up ? '▲' : '▼';
  return `<span class="badge ${good?'good':'critical'}">${arrow} ${Math.abs(pct).toFixed(0)}% vs mês ant.</span>`;
}

function drawBarChart(){
  const canvas = document.getElementById('chartBars'); if(!canvas) return;
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h = 180;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const months = [-5,-4,-3,-2,-1,0];
  const data = months.map(o=>{
    const list = txForMonth(o);
    return { label: monthLabel(o), income: sumBy(list,'income')+(o===0?state.income.monthlyBase:0), expense: sumBy(list,'expense') };
  });
  const maxV = Math.max(1, ...data.map(d=>Math.max(d.income,d.expense)));
  const padL=8, padB=22, padT=32;
  const chartW = w-padL*2, chartH = h-padB-padT;
  const groupW = chartW/data.length;
  const barW = Math.min(16, groupW*0.28);
  ctx.strokeStyle = 'rgba(148,180,214,.16)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(padL, h-padB+.5); ctx.lineTo(w-padL, h-padB+.5); ctx.stroke();

  window._barPoints = [];
  data.forEach((d,i)=>{
    const cx = padL + groupW*i + groupW/2;
    const hIncome = (d.income/maxV)*chartH;
    const hExpense = (d.expense/maxV)*chartH;
    const incomeX = cx-barW-2, expenseX = cx+2;
    const incomeY = h-padB-hIncome, expenseY = h-padB-hExpense;
    ctx.fillStyle = getCss('--c1');
    roundRectTop(ctx, incomeX, incomeY, barW, hIncome, 4); ctx.fill();
    ctx.fillStyle = getCss('--c2');
    roundRectTop(ctx, expenseX, expenseY, barW, hExpense, 4); ctx.fill();

    if(i === data.length-1){
      drawMiniTag(ctx, incomeX+barW/2, incomeY, getCss('--c1'), formatCompact(d.income));
      drawMiniTag(ctx, expenseX+barW/2, expenseY, getCss('--c2'), formatCompact(d.expense));
    }

    ctx.fillStyle = 'rgba(199,212,230,.6)'; ctx.font='700 10px Inter'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText(d.label, cx, h-6);
    window._barPoints.push({x:cx, y0:h-padB-Math.max(hIncome,hExpense), y1:h-padB, w:groupW, d});
  });

  renderTable('bars', ['Mês','Receitas','Despesas'], data.map(d=>[d.label, fmtBRL(d.income), fmtBRL(d.expense)]));
}
function roundRectTop(ctx,x,y,w,h,r){
  h = Math.max(h,1);
  ctx.beginPath();
  ctx.moveTo(x, y+r);
  ctx.arcTo(x,y,x+r,y,r);
  ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w, y+h); ctx.lineTo(x,y+h); ctx.closePath();
}
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function formatCompact(v){
  if(v>=1000) return 'R$'+(v/1000).toFixed(v%1000===0?0:1).replace('.',',')+'k';
  return 'R$'+Math.round(v);
}
function drawMiniTag(ctx, cx, barTopY, color, text){
  ctx.font = '800 9.5px Inter';
  const tagW = ctx.measureText(text).width + 10, tagH = 16;
  const tagX = cx - tagW/2, tagY = Math.max(1, barTopY - tagH - 5);
  roundRectFull(ctx, tagX, tagY, tagW, tagH, tagH/2);
  ctx.fillStyle = 'rgba(6,10,18,.92)'; ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, cx, tagY + tagH/2 + 0.5);
  ctx.textBaseline = 'alphabetic';
}
function roundRectFull(ctx,x,y,w,h,r){
  r = Math.min(r, h/2, Math.max(w,0.01)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function roundRectBottom(ctx,x,y,w,h,r){
  h = Math.max(h,1);
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x+w, y);
  ctx.lineTo(x+w, y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x, y);
  ctx.closePath();
}
function drawMiniTagBelow(ctx, cx, barBottomY, color, text){
  ctx.font = '800 9.5px Inter';
  const tagW = ctx.measureText(text).width + 10, tagH = 16;
  const tagX = cx - tagW/2, tagY = barBottomY + 5;
  roundRectFull(ctx, tagX, tagY, tagW, tagH, tagH/2);
  ctx.fillStyle = 'rgba(6,10,18,.92)'; ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, cx, tagY + tagH/2 + 0.5);
  ctx.textBaseline = 'alphabetic';
}

function drawSavingsChart(){
  const canvas = document.getElementById('chartSavings'); if(!canvas) return;
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h = 170;
  canvas.style.height = h+'px';
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);

  const months = [-5,-4,-3,-2,-1,0];
  const data = months.map(o=>{
    const list = txForMonth(o);
    const income = sumBy(list,'income') + (o===0 ? state.income.monthlyBase : 0);
    const expense = sumBy(list,'expense');
    return { label: monthLabel(o), savings: income - expense };
  });
  const maxAbs = Math.max(1, ...data.map(d=>Math.abs(d.savings)));
  const padL=8, padB=22, padT=28;
  const chartH = h - padB - padT;
  const halfH = chartH/2;
  const zeroY = padT + halfH;
  const slotW = (w - padL*2) / data.length;
  const barW = Math.min(22, slotW*0.42);

  ctx.strokeStyle = 'rgba(148,180,214,.18)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, zeroY+.5); ctx.lineTo(w-padL, zeroY+.5); ctx.stroke();

  window._savingsPoints = [];
  data.forEach((d,i)=>{
    const cx = padL + slotW*i + slotW/2;
    const barH = Math.abs(d.savings)/maxAbs * (halfH-6);
    const positive = d.savings >= 0;
    const color = positive ? getCss('--good-text') : getCss('--critical');
    ctx.fillStyle = color;
    if(positive) roundRectTop(ctx, cx-barW/2, zeroY-barH, barW, barH, 5);
    else roundRectBottom(ctx, cx-barW/2, zeroY, barW, barH, 5);
    ctx.fill();

    if(i === data.length-1){
      const txt = (positive?'+':'-') + formatCompact(Math.abs(d.savings));
      if(positive) drawMiniTag(ctx, cx, zeroY-barH, color, txt);
      else drawMiniTagBelow(ctx, cx, zeroY+barH, color, txt);
    }

    ctx.fillStyle = 'rgba(199,212,230,.6)'; ctx.font='700 10px Inter'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText(d.label, cx, h-6);
    window._savingsPoints.push({x:cx, w:slotW, d});
  });

  renderTable('savings', ['Mês','Economia'], data.map(d=>[d.label, fmtBRL(d.savings)]));
}

function drawWeekdayChart(){
  const canvas = document.getElementById('chartWeekday'); if(!canvas) return;

  const w = canvas.clientWidth, h = 160;

  const peakIdx = wk.sums.indexOf(Math.max(...wk.sums));

  const slotW = (w-padL*2)/7;
  const barW = Math.min(26, slotW*0.5);

  ctx.strokeStyle = 'rgba(148,180,214,.16)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(padL,h-padB+.5); ctx.lineTo(w-padL,h-padB+.5); ctx.stroke();

  window._weekdayPoints = [];
  wk.labels.forEach((lbl,i)=>{
    const cx = padL + slotW*i + slotW/2;
    const bh = Math.max((wk.sums[i]/maxV)*chartH, wk.sums[i]>0?3:0);
    const isPeak = i===peakIdx && wk.sums[i]>0;
    ctx.fillStyle = isPeak ? getCss('--c8') : getCss('--brand-b');
    roundRectTop(ctx, cx-barW/2, h-padB-bh, barW, bh, 5); ctx.fill();
    ctx.fillStyle = 'rgba(199,212,230,.6)'; ctx.font='700 10px Inter'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText(lbl, cx, h-5);
    window._weekdayPoints.push({x:cx, w:slotW, label:lbl, val:wk.sums[i]});
  });

  renderTable('weekday', ['Dia','Total gasto'], wk.labels.map((l,i)=>[l, fmtBRL(wk.sums[i])]));
}

function drawAttentionChart(){
  const canvas = document.getElementById('chartAttn'); if(!canvas) return;
  const list = [...state.envelopes].sort((a,b)=> (envelopeSpent(b.id,0)/(b.budget||1)) - (envelopeSpent(a.id,0)/(a.budget||1)) ).slice(0,4);
  const dpr = window.devicePixelRatio||1;

  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);

  const padTop = 34, padBottom = 22;
  const chartH = h - padTop - padBottom;
  const slotW = w / list.length;
  const barW = Math.min(48, slotW*0.4);

  ctx.strokeStyle = 'rgba(148,180,214,.16)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, h-padBottom+.5); ctx.lineTo(w, h-padBottom+.5); ctx.stroke();

  window._attnPoints = [];
  list.forEach((e,i)=>{
    const spent = envelopeSpent(e.id,0);

    const status = statusForPct(pct);
    const color = getCss('--'+(status==='good'?'good-text':status));
    const cx = slotW*i + slotW/2;
    const barH = Math.max(clamp(pct,0,1) * chartH, 3);
    const barY = h - padBottom - barH;

    ctx.fillStyle = color;
    roundRectTop(ctx, cx-barW/2, barY, barW, barH, 7); ctx.fill();

    const label = Math.round(pct*100)+'%';
    ctx.font = '800 11px Inter';
    const tagW = ctx.measureText(label).width + 16, tagH = 21;
    const tagX = cx - tagW/2, tagY = Math.max(2, barY - tagH - 7);
    roundRectFull(ctx, tagX, tagY, tagW, tagH, tagH/2);
    ctx.fillStyle = 'rgba(6,10,18,.92)'; ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, cx, tagY + tagH/2 + 0.5);

    let name = e.name; if(name.length > 9) name = name.slice(0,8)+'…';
    ctx.fillStyle = 'rgba(199,212,230,.65)'; ctx.font = '700 10.5px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(name, cx, h-6);

    window._attnPoints.push({ x0: slotW*i, x1: slotW*(i+1), e, spent, pct });
  });

  renderTable('attn', ['Categoria','Gasto','Orçamento','%'], list.map(e=>{
    const spent = envelopeSpent(e.id,0);
    const pct = e.budget>0 ? spent/e.budget : 0;
    return [e.name, fmtBRL(spent), fmtBRL(e.budget), Math.round(pct*100)+'%'];
  }));
}

function drawDonut(){
  const canvas = document.getElementById('chartDonut'); if(!canvas) return;
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h=220;
  canvas.width=w*dpr; canvas.height=h*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const cx=w/2, cy=h/2, rOuter=Math.min(w,h)/2-10, rInner=rOuter*0.56;
  let data = state.envelopes.map((e,i)=>({name:e.name, val: envelopeSpent(e.id,0), color: ENVELOPE_COLORS[i%ENVELOPE_COLORS.length]}))
    .filter(d=>d.val>0).sort((a,b)=>b.val-a.val);
  if(data.length>8){
    const rest = data.slice(7).reduce((s,d)=>s+d.val,0);
    data = data.slice(0,7).concat([{name:'Outros', val:rest, color:'#5b5b63'}]);
  }
  const total = data.reduce((s,d)=>s+d.val,0);
  if(!total){
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.font='12px Inter'; ctx.textAlign='center';
    ctx.fillText('Sem despesas registradas este mês', cx, cy);
    document.getElementById('donutLegend').innerHTML='';
    renderTable('donut', ['Categoria','Valor'], []);
    return;
  }
  let start = -Math.PI/2;
  window._donutSlices = [];
  data.forEach(d=>{
    const angle = (d.val/total)*Math.PI*2;
    ctx.save();
    ctx.shadowColor = d.color; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,rOuter,start,start+angle); ctx.closePath();
    ctx.fillStyle = d.color; ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(6,10,18,.9)'; ctx.lineWidth = 2; ctx.stroke();
    window._donutSlices.push({start, end:start+angle, d});
    start += angle;
  });
  ctx.globalCompositeOperation='destination-out';
  ctx.beginPath(); ctx.arc(cx,cy,rInner,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#fff'; ctx.font='800 15px "Inter Tight"'; ctx.textAlign='center';
  ctx.fillText(fmtBRL(total).replace('R$ ','R$'), cx, cy+2);
  ctx.fillStyle='rgba(255,255,255,.4)'; ctx.font='10px Inter';
  ctx.fillText('total no mês', cx, cy+16);

  document.getElementById('donutLegend').innerHTML = data.map(d=>`<span class="legend-item"><span class="legend-dot" style="background:${d.color}"></span>${esc(d.name)} · ${(d.val/total*100).toFixed(0)}%</span>`).join('');
  renderTable('donut', ['Categoria','Valor','%'], data.map(d=>[d.name, fmtBRL(d.val), (d.val/total*100).toFixed(1)+'%']));
}

const DEBT_CATEGORIES = [
  {v:'financiamento', l:'Financiamento'},
  {v:'emprestimo', l:'Empréstimo'},
  {v:'cartao', l:'Cartão'},
  {v:'parcelado', l:'Compra Parcelada'},
  {v:'consorcio', l:'Consórcio'},
  {v:'outros', l:'Outros'},
];
const DEBT_CATEGORY_LABEL = Object.fromEntries(DEBT_CATEGORIES.map(c=>[c.v,c.l]));
const DEBT_CATEGORY_ICON = { financiamento:'building', emprestimo:'wallet', cartao:'card', parcelado:'box', consorcio:'building', outros:'box' };

function round2(v){ return Math.round((v+Number.EPSILON)*100)/100; }
function addMonthsISO(iso, n){
  const d = new Date((iso||todayISO())+'T00:00:00');
  const day = d.getDate();
  const targetY = d.getFullYear(), targetM = d.getMonth()+n;
  const lastDay = new Date(targetY, targetM+1, 0).getDate();
  const result = new Date(targetY, targetM, Math.min(day, lastDay));
  return result.toISOString().slice(0,10);
}
function computeFirstDueDate(contractDateISO, dueDay){
  const c = new Date((contractDateISO||todayISO())+'T00:00:00');
  const lastDay = new Date(c.getFullYear(), c.getMonth()+1, 0).getDate();
  let due = new Date(c.getFullYear(), c.getMonth(), Math.min(dueDay, lastDay));
  if(due <= c) return addMonthsISO(due.toISOString().slice(0,10), 1);
  return due.toISOString().slice(0,10);
}
function monthYearLabel(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  const l = d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  return l.charAt(0).toUpperCase()+l.slice(1);
}
function debtNormalize(d){
  d = d || {};
  return {
    id: d.id || uid(),
    name: d.name || '',
    category: d.category || 'outros',
    institution: d.institution || '',
    originalAmount: d.originalAmount != null ? d.originalAmount : (d.balance||0),
    balance: d.balance || 0,
    rate: d.rate || 0,
    contractDate: d.contractDate || '',
    firstDueDate: d.firstDueDate || todayISO(),
    dueDay: d.dueDay || (d.firstDueDate ? Number(d.firstDueDate.slice(8,10)) : 5),
    totalInstallments: d.totalInstallments || 1,
    paidInstallments: d.paidInstallments || 0,
    installmentAmount: d.installmentAmount != null ? d.installmentAmount : (d.minPayment||0),
    minPayment: d.installmentAmount != null ? d.installmentAmount : (d.minPayment||0),
    autoDebit: d.autoDebit != null ? d.autoDebit : false,
    alreadyDebited: d.alreadyDebited != null ? d.alreadyDebited : true,
  };
}
function debtComputed(d){
  const total = d.totalInstallments||1;
  const paid = clamp(d.paidInstallments||0,0,total);
  const remaining = total-paid;
  const pct = d.balance<=0 ? 1 : (total>0 ? paid/total : 0);
  const nextDue = remaining>0 ? addMonthsISO(d.firstDueDate, paid) : null;
  const payoffDate = remaining>0 ? addMonthsISO(d.firstDueDate, total-1) : d.firstDueDate;
  const amountPaid = Math.max(0, round2((d.originalAmount||d.balance) - d.balance));
  return { total, paid, remaining, pct, nextDue, payoffDate, amountPaid };
}
function simulateSingleDebtPayoff(d, extra){
  let balance = d.balance, months=0, totalInterest=0;
  const pay = (d.installmentAmount||0) + Math.max(0,extra||0);
  if(pay<=0) return { months: 0, totalInterest: 0 };
  while(balance>0.5 && months<600){
    months++;
    const interest = balance*(d.rate/100);
    totalInterest += interest;
    balance += interest;
    balance -= Math.min(pay, balance);
  }
  return { months, totalInterest: Math.round(totalInterest) };
}
function debtSimulateSavings(d, extra){
  const base = simulateSingleDebtPayoff(d, 0);
  const withExtra = simulateSingleDebtPayoff(d, extra);
  return { monthsSaved: Math.max(0, base.months-withExtra.months), interestSaved: Math.max(0, base.totalInterest-withExtra.totalInterest), newMonths: withExtra.months };
}
function debtInsightHTML(d){
  const c = debtComputed(d);
  if(c.remaining<=0 || d.balance<=0){
    return `<div class="insight">${sevBadge('shield','good')}<div class="tx">Dívida quitada. Parabéns pela disciplina!</div></div>`;
  }
  let text = `Você possui <b>${c.remaining} parcela${c.remaining===1?'':'s'} restante${c.remaining===1?'':'s'}</b>. Mantendo o pagamento atual, essa dívida termina em <b>${monthYearLabel(c.payoffDate)}</b>.`;
  const extraTry = Math.max(round2((d.installmentAmount||0)*0.15), 100);
  const sim = debtSimulateSavings(d, extraTry);
  if(sim.monthsSaved>0){
    text += ` Se adicionar ${fmtBRL(extraTry)}/mês, você quita ${sim.monthsSaved} mês${sim.monthsSaved===1?'':'es'} antes e economiza aproximadamente ${fmtBRL(sim.interestSaved)} em juros.`;
  }
  return `<div class="insight">${sevBadge('bulb','neutral')}<div class="tx">${text}</div></div>`;
}

function ensureDebtEnvelope(){
  let env = state.envelopes.find(e=>e.name==='Dívidas');
  const activeTotal = round2(state.debts.filter(d=>d.balance>0).reduce((s,d)=>s+(d.installmentAmount||0),0));
  if(!env){
    env = { id: uid(), name:'Dívidas', icon:'card', color:'#ef4a4a', budget: activeTotal, fixed:true };
    state.envelopes.push(env);
    cloudInsert('envelopes', { id:env.id, user_id: session?.user?.id, name:env.name, icon:env.icon, color:env.color, budget:env.budget, fixed:env.fixed });
  } else if(env.budget !== activeTotal || !env.fixed){
    env.budget = activeTotal; env.fixed = true;
    cloudUpdate('envelopes', env.id, { budget: env.budget, fixed: true });
  }
  return env;
}
function payDebtInstallment(id){
  const d = state.debts.find(x=>x.id===id); if(!d || d.balance<=0) return;
  d.paidInstallments = Math.min(d.totalInstallments, (d.paidInstallments||0)+1);
  d.balance = Math.max(0, round2(d.balance - d.installmentAmount));
  const env = ensureDebtEnvelope();
  const tx = { id: uid(), type:'expense', amount:d.installmentAmount, category:'Dívidas', envelopeId:env.id, date: todayISO(), note:`Parcela ${d.paidInstallments}/${d.totalInstallments} — ${d.name}`, createdAt: Date.now() };
  state.transactions.push(tx);
  cloudInsert('transactions', { id:tx.id, user_id: session?.user?.id, type:tx.type, amount:tx.amount, category:tx.category, envelope_id:env.id, date:tx.date, note:tx.note });
  cloudUpdate('debts', d.id, { paid_installments:d.paidInstallments, balance:d.balance });
  updateStreak(); save(); closeModal(); render();
  const remaining = d.totalInstallments-d.paidInstallments;
  toast(remaining>0 ? `Parabéns! Agora faltam apenas ${remaining} parcela(s).` : 'Parabéns! Dívida quitada! 🎉');
}
function quitarDebt(id){
  const d = state.debts.find(x=>x.id===id); if(!d) return;
  if(d.balance<=0){ toast('Essa dívida já está quitada'); return; }
  if(!confirm(`Quitar "${d.name}" agora, lançando ${fmtBRL(d.balance)} como despesa?`)) return;
  const payoffAmount = d.balance;
  const env = ensureDebtEnvelope();
  const tx = { id: uid(), type:'expense', amount:payoffAmount, category:'Dívidas', envelopeId:env.id, date: todayISO(), note:`Quitação — ${d.name}`, createdAt: Date.now() };
  state.transactions.push(tx);
  d.balance = 0; d.paidInstallments = d.totalInstallments;
  cloudInsert('transactions', { id:tx.id, user_id: session?.user?.id, type:tx.type, amount:tx.amount, category:tx.category, envelope_id:env.id, date:tx.date, note:tx.note });
  cloudUpdate('debts', d.id, { paid_installments:d.paidInstallments, balance:0 });
  updateStreak(); save(); closeModal(); render(); toast('Dívida quitada! 🎉');
}
function processAutoDebits(){
  const today = todayISO();
  let changed = false;
  let env = null;
  state.debts.forEach(d=>{
    if(!d.autoDebit || d.balance<=0 || !d.firstDueDate) return;
    let guard = 0, debtChanged = false;
    while(d.paidInstallments < d.totalInstallments && addMonthsISO(d.firstDueDate, d.paidInstallments) <= today && guard<600){
      guard++;
      if(!env) env = ensureDebtEnvelope();
      const dueISO = addMonthsISO(d.firstDueDate, d.paidInstallments);
      d.paidInstallments += 1;
      d.balance = Math.max(0, round2(d.balance - d.installmentAmount));
      const tx = { id: uid(), type:'expense', amount:d.installmentAmount, category:'Dívidas', envelopeId:env.id, date: dueISO, note:`Parcela ${d.paidInstallments}/${d.totalInstallments} — ${d.name} (débito automático)`, createdAt: Date.now() };
      state.transactions.push(tx);
      cloudInsert('transactions', { id:tx.id, user_id: session?.user?.id, type:tx.type, amount:tx.amount, category:tx.category, envelope_id:env.id, date:tx.date, note:tx.note });
      changed = true; debtChanged = true;
    }
    if(debtChanged) cloudUpdate('debts', d.id, { paid_installments:d.paidInstallments, balance:d.balance });
  });
  if(env) ensureDebtEnvelope();
  if(changed){ updateStreak(); save(); toast('Parcela(s) de dívida debitada(s) automaticamente'); }
}
function processAutoEnvelopeLaunches(){
  const now = new Date();
  const currentKey = monthKey(now);
  const currentDay = now.getDate();
  let changed = false;
  state.envelopes.forEach(e=>{
    if(!e.fixed || !e.autoLaunch || !e.budget) return;
    if(e.lastAutoLaunch === currentKey) return;
    const due = clamp(e.dueDay||5, 1, 31);
    if(currentDay < due) return;
    const tx = { id: uid(), type:'expense', amount:e.budget, category:e.name, envelopeId:e.id, date: todayISO(), note:`${e.name} (lançamento automático)`, createdAt: Date.now() };
    state.transactions.push(tx);
    cloudInsert('transactions', { id:tx.id, user_id: session?.user?.id, type:tx.type, amount:tx.amount, category:tx.category, envelope_id:e.id, date:tx.date, note:tx.note });
    e.lastAutoLaunch = currentKey;
    cloudUpdate('envelopes', e.id, { last_auto_launch: currentKey });
    changed = true;
  });
  if(changed){ updateStreak(); save(); toast('Despesa(s) fixa(s) do mês lançada(s) automaticamente'); }
}
function simulateDebtPayoff(debts, strategy, extra){
  let list = debts.map(d=>({...d}));
  const order = strategy==='avalanche' ? [...list].sort((a,b)=>b.rate-a.rate) : [...list].sort((a,b)=>a.balance-b.balance);
  let months=0, totalInterest=0;
  const byId = Object.fromEntries(list.map(d=>[d.id,d]));
  while(order.some(d=>byId[d.id].balance>0.5) && months<600){
    months++;
    let freedExtra = extra;
    order.forEach(o=>{
      const d = byId[o.id]; if(d.balance<=0) return;
      const interest = d.balance*(d.rate/100);
      totalInterest += interest;
      d.balance += interest;
    });
    for(const o of order){
      const d = byId[o.id]; if(d.balance<=0) continue;
      let pay = Math.min(d.minPayment, d.balance);
      d.balance -= pay;
    }
    for(const o of order){
      const d = byId[o.id]; if(d.balance<=0 || freedExtra<=0) continue;
      const pay = Math.min(freedExtra, d.balance);
      d.balance -= pay; freedExtra -= pay;
    }
  }
  return { months, totalInterest: Math.round(totalInterest) };
}

function hexToRgba(hex, alpha){
  hex = hex.replace('#','');
  const r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function shade(hex, amt){
  hex = hex.replace('#','');
  const r = clamp(parseInt(hex.substring(0,2),16)+amt,0,255);
  const g = clamp(parseInt(hex.substring(2,4),16)+amt,0,255);
  const b = clamp(parseInt(hex.substring(4,6),16)+amt,0,255);
  return `rgb(${r},${g},${b})`;
}
function currentThemeIsLight(){ return document.documentElement.getAttribute('data-theme')==='light'; }
function themeDefaultColor(key){
  const light = currentThemeIsLight();
  if(key==='cards') return light ? '#ffffff' : '#121a29';
  return light ? '#f2f4fa' : '#05070c';
}
function applyCustomColors(){
  const cc = state.appearance.customColors || {};
  const root = document.documentElement.style;
  if(cc.background) root.setProperty('--page', cc.background);
  else root.removeProperty('--page');

  if(cc.cards){
    root.setProperty('--surface-solid', cc.cards);
    root.setProperty('--surface', hexToRgba(cc.cards,.55));
    root.setProperty('--surface-2', hexToRgba(cc.cards,.75));
    root.setProperty('--sheet-bg', cc.cards);
    root.setProperty('--drawer-bg', cc.cards);
    root.setProperty('--card-navy', `linear-gradient(165deg, ${shade(cc.cards,14)}, ${shade(cc.cards,-10)})`);
  } else {
    ['--surface-solid','--surface','--surface-2','--sheet-bg','--drawer-bg','--card-navy'].forEach(p=>root.removeProperty(p));
  }

  if(cc.bars){
    root.setProperty('--scrim-strong', hexToRgba(cc.bars,.92));
    root.setProperty('--scrim-clear', hexToRgba(cc.bars,0));
    root.setProperty('--tabbar-bg', hexToRgba(cc.bars,.85));
  } else {
    ['--scrim-strong','--scrim-clear','--tabbar-bg'].forEach(p=>root.removeProperty(p));
  }
}

/* ---------- event delegation ---------- */
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  switch(action){
    case 'goto':
      state.ui.tab = el.dataset.tab; save(); render(); window.scrollTo(0,0); break;
    case 'toggle-privacy':
      state.privacy.hideValues = !state.privacy.hideValues; save(); render();
      cloudUpdateProfile({ hide_values: state.privacy.hideValues }); break;
    case 'tx-filter':
      state.ui.txFilter = el.dataset.f; render(); break;
    case 'close-modal': closeModal(); break;
    case 'open-drawer': openDrawer(); break;
    case 'close-drawer': closeDrawer(); break;
    case 'goto-drawer':
      closeDrawer(); state.ui.tab = el.dataset.tab; save(); render(); window.scrollTo(0,0); break;
    case 'new-tx': openTxForm(); break;
    case 'edit-tx': openTxForm(state.transactions.find(t=>t.id===el.dataset.id)); break;
    case 'delete-tx':
      state.transactions = state.transactions.filter(t=>t.id!==el.dataset.id);
      updateStreak(); save(); closeModal(); render(); toast('Lançamento excluído');
      cloudDelete('transactions', el.dataset.id); break;
    case 'tx-type': {
      document.getElementById('txType').value = el.dataset.v;
      el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('envFieldWrap').style.display = el.dataset.v==='expense'?'block':'none';
      break;
    }
    case 'new-envelope': openEnvelopeForm(); break;
    case 'edit-envelope': openEnvelopeForm(state.envelopes.find(x=>x.id===el.dataset.id)); break;
    case 'delete-envelope':
      state.envelopes = state.envelopes.filter(x=>x.id!==el.dataset.id);
      state.transactions.forEach(t=>{ if(t.envelopeId===el.dataset.id) t.envelopeId=''; });
      save(); closeModal(); render(); toast('Envelope excluído');
      cloudDelete('envelopes', el.dataset.id); break;
    case 'new-goal': openGoalForm(); break;
    case 'edit-goal': case 'open-goal': openGoalForm(state.goals.find(g=>g.id===el.dataset.id)); break;
    case 'delete-goal':
      state.goals = state.goals.filter(g=>g.id!==el.dataset.id);
      save(); closeModal(); render(); toast('Meta excluída');
      cloudDelete('goals', el.dataset.id); break;
    case 'contribute-goal': openContributeForm(el.dataset.id); break;
    case 'new-debt': openDebtForm(); break;
    case 'edit-debt': openDebtForm(state.debts.find(d=>d.id===el.dataset.id)); break;
    case 'delete-debt':
      state.debts = state.debts.filter(d=>d.id!==el.dataset.id);
      save(); closeModal(); render(); toast('Dívida removida');
      cloudDelete('debts', el.dataset.id); break;
    case 'debt-strategy': state.ui.debtStrategy = el.dataset.s; render(); break;
    case 'debt-detail': openDebtDetail(el.dataset.id); break;
    case 'pay-installment-debt': payDebtInstallment(el.dataset.id); break;
    case 'quitar-debt': quitarDebt(el.dataset.id); break;
    case 'debt-simulate': {
      const dd = state.debts.find(x=>x.id===el.dataset.id); if(!dd) break;
      const extra = parseFloat(document.getElementById('debtSimExtra').value)||0;
      const box = document.getElementById('debtSimResult');
      if(extra<=0){ box.innerHTML = ''; break; }
      const sim = debtSimulateSavings(dd, extra);
      box.innerHTML = `<div class="grid2">
        <div class="hero-pill"><div class="lbl">QUITA EM</div><div class="val">${sim.newMonths} meses</div></div>
        <div class="hero-pill"><div class="lbl">ECONOMIA EM JUROS</div><div class="val" style="color:var(--good-text)">${fmtBRL(sim.interestSaved)}</div></div>
      </div>${sim.monthsSaved>0?`<div class="section-sub" style="margin-top:8px;">Você quitaria ${sim.monthsSaved} mês(es) antes.</div>`:''}`;
      break;
    }
    case 'toggle-table': {
      const t = document.getElementById('table-'+el.dataset.t);
      t.style.display = t.style.display==='none' ? 'block' : 'none';
      break;
    }
    case 'save-profile': {
      state.profile.name = document.getElementById('setName').value.trim();
      state.income.monthlyBase = parseFloat(document.getElementById('setIncome').value)||0;
      save(); render(); toast('Perfil salvo');
      cloudUpdateProfile({ name: state.profile.name, monthly_income: state.income.monthlyBase });
      break;
    }
    case 'export-data': {
      const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'atlas-backup-'+todayISO()+'.json'; a.click();
      break;
    }
    case 'reset-data': {
      if(confirm(`Isso vai apagar TODOS os seus dados financeiros${CLOUD_ENABLED?' (neste dispositivo e na nuvem)':' deste dispositivo'}. Tem certeza?`)){
        if(confirm('Confirmação final: não é possível desfazer. Continuar?')){
          if(CLOUD_ENABLED && session){
            const uidAuth = session.user.id;
            Promise.all([
              sb.from('transactions').delete().eq('user_id', uidAuth),
              sb.from('envelopes').delete().eq('user_id', uidAuth),
              sb.from('goals').delete().eq('user_id', uidAuth),
              sb.from('debts').delete().eq('user_id', uidAuth),
              sb.from('profiles').update({ onboarded:false, monthly_income:0 }).eq('id', uidAuth),
            ]).catch(e=>console.warn('falha ao apagar dados na nuvem', e));
          }
          localStorage.removeItem(STORAGE_KEY);
          state = defaultState();
          render(); toast('Dados apagados');
        }
      }
      break;
    }
    case 'set-pin': openPinSetup(); break;
    case 'remove-pin':
      state.security.pin=null; save(); render(); toast('PIN removido');
      cloudUpdateProfile({ pin_hash: null }); break;
    case 'set-theme':
      state.appearance.theme = el.dataset.v; save(); applyTheme(); renderDrawer();
      cloudUpdateProfile({ theme: state.appearance.theme }); break;
    case 'open-theme': closeDrawer(); openThemeModal(); break;
    case 'reset-custom-colors':
      state.appearance.customColors = {}; save(); applyCustomColors(); openThemeModal(); toast('Cores restauradas');
      cloudUpdateProfile({ custom_colors: {} });
      break;
    case 'logout': closeDrawer(); logout(); break;
  }

  // icon/color pickers inside forms
  if(el.dataset.ic && el.closest('#envIconPick')){
    el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active')); el.classList.add('active');
    document.getElementById('envIcon').value = el.dataset.ic;
  }
  if(el.dataset.c && el.closest('#envColorPick')){
    el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active')); el.classList.add('active');
    document.getElementById('envColor').value = el.dataset.c;
  }
  if(el.dataset.ic && el.closest('#goalIconPick')){
    el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active')); el.classList.add('active');
    document.getElementById('goalIcon').value = el.dataset.ic;
  }
});
