<title>ÓRBITA — sua vida em órbita</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Agenda inteligente, tarefas, hábitos e metas — sua vida em órbita." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#08090b" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ÓRBITA" />
<style>
  :root {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --surface-2: #f0f0f2;
    --sidebar: #ffffff;
    --bar: #ffffff;
    --border: #e6e6e9;
    --text: #0b0f14;
    --text-muted: #6a7078;
    --text-faint: #9a9fa6;
    --accent: #ff6b00;
    --accent-hover: #e6600a;
    --accent-ink: #14100a;
    --accent-soft: #ffe6d1;
    --good: #1f9d6c;
    --good-soft: #dcf3e8;
    --warn: #b8790a;
    --warn-soft: #fbedd0;
    --danger: #d13c3c;
    --danger-soft: #fbdcdc;
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 16px;
    --shadow-sm: 0 1px 2px rgba(11,15,20,0.05);
    --shadow: 0 8px 28px -12px rgba(11,15,20,0.22);
    --shadow-lg: 0 24px 60px -20px rgba(11,15,20,0.35);
  }

  :root[data-theme="dark"] {
    --bg: #0b0f14;
    --surface: #11161c;
    --surface-2: #161c23;
    --sidebar: #0d1218;
    --bar: #0d1218;
    --border: #212830;
    --text: #f2f3f5;
    --text-muted: #8b929c;
    --text-faint: #5b636d;
    --accent: #ff7a1a;
    --accent-hover: #ff8c3d;
    --accent-ink: #14100a;
    --accent-soft: #2e1c0d;
    --good: #38c78e;
    --good-soft: #123024;
    --warn: #e0a83c;
    --warn-soft: #2e2410;
    --danger: #ef5f5f;
    --danger-soft: #351515;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow: 0 8px 28px -12px rgba(0,0,0,0.55);
    --shadow-lg: 0 24px 70px -20px rgba(0,0,0,0.7);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0f14;
      --surface: #11161c;
      --surface-2: #161c23;
      --sidebar: #0d1218;
      --bar: #0d1218;
      --border: #212830;
      --text: #f2f3f5;
      --text-muted: #8b929c;
      --text-faint: #5b636d;
      --accent: #ff7a1a;
      --accent-hover: #ff8c3d;
      --accent-ink: #14100a;
      --accent-soft: #2e1c0d;
      --good: #38c78e;
      --good-soft: #123024;
      --warn: #e0a83c;
      --warn-soft: #2e2410;
      --danger: #ef5f5f;
      --danger-soft: #351515;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow: 0 8px 28px -12px rgba(0,0,0,0.55);
      --shadow-lg: 0 24px 70px -20px rgba(0,0,0,0.7);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 14.5px;
    line-height: 1.45;
  }

  h1, h2, h3, h4 { text-wrap: balance; letter-spacing: -0.02em; margin: 0; }
  .mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }

  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  svg.ic { display: block; flex-shrink: 0; }

  /* ---------------- shell ---------------- */
  #shell {
    display: grid;
    grid-template-columns: 236px 1fr;
    min-height: 100vh;
  }

  @media (max-width: 860px) {
    #shell { grid-template-columns: 1fr; }
  }

  .sidebar {
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    position: sticky;
    top: 0;
    height: 100vh;
  }

  @media (max-width: 860px) {
    .sidebar { display: none; }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 4px 8px;
  }

  .brand .mark {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1.6px solid var(--accent);
    position: relative;
    flex-shrink: 0;
  }
  .brand .mark::after {
    content: "";
    position: absolute;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .brand .mark::before {
    content: "";
    position: absolute;
    width: 34px; height: 12px;
    border: 1.4px solid var(--accent);
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-28deg);
    opacity: 0.55;
  }

  .brand .name {
    font-weight: 700;
    font-size: 1.02rem;
    letter-spacing: -0.01em;
  }

  nav.nav { display: flex; flex-direction: column; gap: 2px; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 9px 10px;
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    border: none;
    background: transparent;
    text-align: left;
    font-size: 0.92rem;
    font-weight: 500;
    width: 100%;
  }
  .nav-item svg.ic { color: var(--accent); }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: var(--surface-2); color: var(--text); font-weight: 700; }

  .sidebar-footer {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .theme-switch {
    display: flex;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .theme-switch button {
    flex: 1;
    border: none;
    background: var(--surface-2);
    padding: 7px 0;
    color: var(--text-muted);
    display: flex;
    justify-content: center;
  }
  .theme-switch button.active { background: var(--accent); color: var(--accent-ink); }

  /* ---------------- main / topbar ---------------- */
  .main { min-width: 0; display: flex; flex-direction: column; }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bar) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: calc(14px + env(safe-area-inset-top)) 26px 14px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .hamburger-btn {
    display: none;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-sm);
    width: 34px; height: 34px;
    align-items: center; justify-content: center;
    color: var(--text);
    flex-shrink: 0;
  }
  @media (max-width: 860px) { .hamburger-btn { display: flex; } }

  .topbar h1 { font-size: 1.15rem; }

  .search-wrap {
    flex: 1;
    max-width: 420px;
    margin-left: 12px;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px 8px 34px;
    font-size: 0.86rem;
  }
  .search-wrap input:focus { outline: none; border-color: var(--accent); }
  .search-wrap svg.ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }

  .search-results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    max-height: 320px;
    overflow-y: auto;
    z-index: 30;
  }
  .search-results button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .search-results button:last-child { border-bottom: none; }
  .search-results button:hover { background: var(--surface-2); }
  .search-results .sr-type { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); }

  .topbar-spacer { flex: 1; }

  .icon-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-sm);
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
    position: relative;
  }
  .icon-btn:hover { color: var(--text); background: var(--surface-2); }
  .icon-btn .dot {
    position: absolute; top: 5px; right: 5px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    border: 1.5px solid var(--surface);
  }

  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.85rem;
    cursor: pointer; overflow: hidden; flex-shrink: 0; position: relative;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar.avatar-lg { width: 56px; height: 56px; font-size: 1.3rem; cursor: default; }

  .avatar-crop-outer { display: flex; justify-content: center; margin-bottom: 16px; }
  .avatar-crop-circle {
    width: 220px; height: 220px; border-radius: 50%;
    overflow: hidden; position: relative;
    background: var(--surface-2); border: 1px solid var(--border);
    cursor: grab; touch-action: none;
  }
  .avatar-crop-circle.dragging { cursor: grabbing; }
  .avatar-crop-circle img { position: absolute; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .avatar-crop-hint { text-align: center; font-size: 0.78rem; color: var(--text-muted); margin: 10px 0 0; }

  .view-root { padding: 22px 26px 90px; max-width: 1120px; width: 100%; margin: 0 auto; }

  /* bottom nav (mobile) */
  .bottom-nav {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bar);
    border-top: 1px solid var(--border);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index: 40;
    justify-content: space-around;
  }
  @media (max-width: 860px) { .bottom-nav { display: flex; } }
  .bottom-nav button {
    background: none; border: none;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: var(--text-faint);
    font-size: 0.62rem;
    padding: 5px 8px;
  }
  .bottom-nav button svg.ic { color: var(--accent); }
  .bottom-nav button.active { color: var(--accent); }

  /* ---------------- mobile drawer ---------------- */
  .mobile-drawer-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 90; display: flex;
  }
  .mobile-drawer-backdrop.hidden { display: none; }
  .mobile-drawer {
    width: 260px; max-width: 82vw; height: 100%;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    padding: calc(20px + env(safe-area-inset-top)) 14px 20px;
    display: flex; flex-direction: column; gap: 22px;
    position: relative;
    animation: drawer-slide-in 0.18s ease;
  }
  @keyframes drawer-slide-in { from { transform: translateX(-100%); } to { transform: translateX(0); } }
  .drawer-close-btn {
    position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 14px;
    border: none; background: var(--surface-2); border-radius: 50%;
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
  }
  @media (prefers-reduced-motion: reduce) { .mobile-drawer { animation: none; } }

  /* ---------------- generic pieces ---------------- */
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .section-head h2 { font-size: 1.3rem; }
  .section-head p.hint { margin: 3px 0 0; color: var(--text-muted); font-size: 0.85rem; }

  .btn {
    border: none; border-radius: var(--radius-sm);
    padding: 9px 15px; font-weight: 600; font-size: 0.86rem;
    display: inline-flex; align-items: center; gap: 7px;
    transition: filter 0.12s ease, background-color 0.12s ease, transform 0.06s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-accent { background: var(--accent); color: var(--accent-ink); }
  .btn-accent:hover { filter: brightness(1.12); }
  .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--border); }
  .btn-danger { background: var(--danger-soft); color: var(--danger); }
  .btn-sm { padding: 6px 11px; font-size: 0.78rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-hover));
    opacity: 0.9;
  }
  .card::after {
    content: "";
    position: absolute; top: -60px; right: -60px; width: 150px; height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
    opacity: 0.12;
    pointer-events: none;
  }

  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 3px 9px; border-radius: 999px;
  }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .empty-block {
    text-align: center; padding: 46px 16px; color: var(--text-muted);
  }
  .empty-block .big-ic { color: var(--text-faint); margin-bottom: 10px; }

  /* ---------------- dashboard ---------------- */
  .glow-border {
    position: relative;
    box-shadow:
      0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent),
      0 0 22px 1px color-mix(in srgb, var(--accent) 32%, transparent),
      0 0 44px 6px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  .glow-border::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.5px;
    background: linear-gradient(135deg, var(--accent-hover), var(--accent), var(--accent-hover));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }

  .greeting-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 26px 28px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .greeting-card h1 { font-size: 1.55rem; margin-bottom: 4px; }
  .greeting-card .date-line { color: var(--text-muted); font-size: 0.92rem; margin-bottom: 18px; }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-2);
  }
  .stat-chip {
    text-align: center;
    padding: 14px 10px;
    border-left: 1px solid var(--border);
    position: relative;
    min-width: 0;
  }
  .stat-chip:first-child { border-left: none; }
  .stat-chip .l {
    font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px;
    line-height: 1.25; overflow-wrap: anywhere;
  }
  .stat-chip .n { font-size: 1.28rem; font-weight: 700; }

  @media (max-width: 480px) {
    .stat-chip { padding: 10px 4px; }
    .stat-chip .l { font-size: 0.62rem; letter-spacing: 0.01em; margin-bottom: 4px; }
    .stat-chip .n { font-size: 1.1rem; }
  }

  .progress-wrap { margin-top: 18px; }
  .progress-wrap .pl { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 6px; }
  .progress-track { height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.4s ease; }

  .dash-grid {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 18px;
  }
  @media (max-width: 760px) { .dash-grid { grid-template-columns: 1fr; } }

  .dash-panel { padding: 18px 20px; }
  .dash-panel h3 { font-size: 0.98rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .dash-panel h3 svg { color: var(--accent); }
  .mini-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .mini-row { display: flex; align-items: center; gap: 10px; font-size: 0.86rem; }
  .mini-row .t { font-weight: 700; font-size: 0.8rem; color: var(--text-muted); min-width: 42px; }
  .mini-row .txt { flex: 1; min-width: 0; }
  .mini-row .txt .tt { font-weight: 600; }
  .mini-row .txt .ms { color: var(--text-muted); font-size: 0.78rem; }

  .habit-today-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .habit-today-btn {
    display: flex; align-items: center; gap: 7px;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px 6px 8px;
    background: var(--surface-2);
    font-size: 0.8rem;
  }
  .habit-today-btn .dot-check {
    width: 17px; height: 17px; border-radius: 50%;
    border: 1.6px solid var(--text-faint);
    display: flex; align-items: center; justify-content: center;
  }
  .habit-today-btn.done { border-color: var(--good); color: var(--good); background: var(--good-soft); }
  .habit-today-btn.done .dot-check { border-color: var(--good); background: var(--good); color: white; }

  /* ---------------- agenda ---------------- */
  .subtabs { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 3px; }
  .subtabs button { border: none; background: none; padding: 6px 13px; border-radius: 5px; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
  .subtabs button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

  .timeline { display: flex; flex-direction: column; gap: 0; }
  .tl-item { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .tl-item:last-child { border-bottom: none; }
  .tl-time { width: 54px; flex-shrink: 0; font-weight: 700; font-size: 0.85rem; padding-top: 2px; }
  .tl-rail { width: 2px; background: var(--border); position: relative; flex-shrink: 0; margin: 2px 0; }
  .tl-rail::before { content: ""; position: absolute; top: 4px; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--accent)); }
  .tl-body { flex: 1; min-width: 0; padding-bottom: 2px; }
  .tl-body .tt { font-weight: 700; margin-bottom: 3px; }
  .tl-body .mt { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.8rem; color: var(--text-muted); }
  .tl-actions { display: flex; gap: 6px; align-items: flex-start; }

  .day-group-head { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 10px; }
  .day-group-head:first-child { margin-top: 0; }
  .day-group-head .dn { font-size: 1.15rem; font-weight: 700; }
  .day-group-head .dl { color: var(--text-muted); font-size: 0.82rem; text-transform: capitalize; }

  .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  @media (max-width: 760px) { .week-grid { grid-template-columns: 1fr; } }
  .week-col { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; background: var(--surface); min-height: 140px; }
  .week-col .wc-head { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .week-col.is-today { border-color: var(--accent); }
  .week-col.is-today .wc-head { color: var(--accent); font-weight: 700; }
  .wc-item { font-size: 0.76rem; padding: 5px 7px; border-radius: 6px; background: var(--surface-2); margin-bottom: 5px; border-left: 3px solid var(--dot, var(--accent)); }
  .wc-item .wt { font-weight: 700; font-family: ui-monospace, monospace; }

  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .month-dow { text-align: center; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); padding-bottom: 6px; }
  .month-cell {
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface);

      settings: { name: "", theme: "system", notifiedIds: [], customColors: {}, avatarPhoto: null },
      appointments: [],
      tasks: [],
      habits: [],
      goals: []
    };
  }

  function mergeState(parsed) {
    var d = defaultState();
    if (!parsed) return d;
    return {
      settings: Object.assign(d.settings, parsed.settings || {}),
      appointments: parsed.appointments || [],
      tasks: parsed.tasks || [],
      habits: parsed.habits || [],
      goals: parsed.goals || []
    };
  }

  function loadLocalCache() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      return raw ? mergeState(JSON.parse(raw)) : defaultState();
    } catch (e) { return defaultState(); }
  }

  var state = loadLocalCache();

  function persist() {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    if (!currentUser) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      sb.from("app_state")
        .upsert({ user_id: currentUser.id, data: state, updated_at: new Date().toISOString() }, { onConflict: "user_id" })
        .then(function (res) { if (res.error) showToast("Erro ao sincronizar: " + res.error.message); });
    }, 400);
  }

  function loadRemoteState(userId) {
    return sb.from("app_state").select("data").eq("user_id", userId).maybeSingle().then(function (res) {
      if (res.error) throw res.error;
      state = mergeState(res.data && res.data.data);
      if (!state.settings.name && currentUser && currentUser.email) {
        state.settings.name = currentUser.email.split("@")[0];
      }
    });
  }

  function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  /* ============ DATE HELPERS ============ */
  function pad2(n) { return String(n).padStart(2, "0"); }
  function toISO(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function parseISO(s) { var p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function todayISO() { return toISO(new Date()); }
  function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r; }
  function startOfWeek(d) { var r = new Date(d); r.setDate(r.getDate() - r.getDay()); return r; }
  function apptDateTime(a) { return new Date(a.date + "T" + (a.time || "00:00")); }

  /* ============ THEME COLOR HELPERS ============ */
  function relLuminance(hex) {
    var c = hex.replace("#", "");
    if (c.length === 3) c = c.split("").map(function (ch) { return ch + ch; }).join("");
    var r = parseInt(c.substr(0, 2), 16) / 255, g = parseInt(c.substr(2, 2), 16) / 255, b = parseInt(c.substr(4, 2), 16) / 255;
    function lin(v) { return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
    return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  }
  function inkFor(hex) { return relLuminance(hex) > 0.45 ? "#14100a" : "#f5f6f7"; }

  function currentTokenValue(key) {
    return getComputedStyle(document.documentElement).getPropertyValue("--" + key).trim();
  }

  function setCustomColor(key, value) {
    if (!state.settings.customColors) state.settings.customColors = {};
    if (value) state.settings.customColors[key] = value; else delete state.settings.customColors[key];
    persist();
    applyCustomColors();
  }

  function applyCustomColors() {
    var root = document.documentElement;
    var cc = state.settings.customColors || {};
    ["bg", "surface", "sidebar", "bar"].forEach(function (key) {
      if (cc[key]) root.style.setProperty("--" + key, cc[key]);
      else root.style.removeProperty("--" + key);
    });
    if (cc.accent) {
      root.style.setProperty("--accent", cc.accent);
      root.style.setProperty("--accent-ink", inkFor(cc.accent));
    } else {
      root.style.removeProperty("--accent");
      root.style.removeProperty("--accent-ink");
    }
  }
  function fmtFull(d) { return DOW_FULL[d.getDay()] + ", " + d.getDate() + " de " + MON_FULL[d.getMonth()]; }
  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  /* ============ VIEW STATE (in-memory, not persisted) ============ */
  var ui = {
    view: "dashboard",
    agendaMode: "list",
    weekAnchor: startOfWeek(new Date()),
    monthAnchor: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
    taskFilter: "pending",
    editModal: null
  };

  /* ============ TOAST ============ */
  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.add("hidden"); }, 2200);
  }

  /* ============ THEME ============ */
  function applyTheme() {
    var mode = state.settings.theme;
    var root = document.documentElement;
    if (mode === "light") root.setAttribute("data-theme", "light");
    else if (mode === "dark") root.setAttribute("data-theme", "dark");
    else root.removeAttribute("data-theme");
    document.querySelectorAll(".theme-switch button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-theme-opt") === mode);
    });
  }

  /* ============ AVATAR / PROFILE PHOTO ============ */
  function renderAvatar() {
    var initial = (state.settings.name || "?").charAt(0).toUpperCase();
    var photo = state.settings.avatarPhoto;
    [document.getElementById("avatar"), document.getElementById("avatar-preview")].forEach(function (elm) {
      if (!elm) return;
      elm.innerHTML = photo ? '<img src="' + photo + '" alt="Foto de perfil" />' : "";
      if (!photo) elm.textContent = initial;
    });
  }

  function openAvatarCropModal(file) {
    if (!file || file.type.indexOf("image/") !== 0) { showToast("Selecione um arquivo de imagem."); return; }
    var reader = new FileReader();
    reader.onload = function (e) {
      var body =
        '<div class="avatar-crop-outer"><div class="avatar-crop-circle" id="crop-circle"><img id="crop-img" src="' + e.target.result + '" alt="" /></div></div>' +
        '<div class="field"><label>Zoom</label><input type="range" id="crop-zoom" min="100" max="300" value="100" /></div>' +
        '<p class="avatar-crop-hint">Arraste a foto para centralizar dentro do círculo.</p>';
      var footer = '<div class="modal-actions"><button class="btn btn-ghost" id="crop-cancel">Cancelar</button><button class="btn btn-accent" id="crop-save">Salvar foto</button></div>';
      var modal = openModal("Ajustar foto de perfil", body, footer);

      var circle = modal.querySelector("#crop-circle");
      var imgEl = modal.querySelector("#crop-img");
      var zoomInput = modal.querySelector("#crop-zoom");
      var C = 220;
      var iw = 0, ih = 0, baseScale = 1, scale = 1, left = 0, top = 0;
      var dragging = false, startX = 0, startY = 0, startLeft = 0, startTop = 0;

      function layout() {
        var dispW = iw * scale, dispH = ih * scale;
        left = Math.min(0, Math.max(C - dispW, left));
        top = Math.min(0, Math.max(C - dispH, top));
        imgEl.style.width = dispW + "px";
        imgEl.style.height = dispH + "px";
        imgEl.style.left = left + "px";
        imgEl.style.top = top + "px";
      }

      function initLayout() {
        iw = imgEl.naturalWidth; ih = imgEl.naturalHeight;
        baseScale = C / Math.min(iw, ih);
        scale = baseScale;
        left = (C - iw * scale) / 2;
        top = (C - ih * scale) / 2;
        layout();
      }
      if (imgEl.complete && imgEl.naturalWidth) initLayout(); else imgEl.addEventListener("load", initLayout);

      function onZoomInput() {
        var z = Number(zoomInput.value) / 100;
        var dispWOld = iw * scale, dispHOld = ih * scale;
        var centerXRatio = dispWOld ? (C / 2 - left) / dispWOld : 0.5;
        var centerYRatio = dispHOld ? (C / 2 - top) / dispHOld : 0.5;
        scale = baseScale * z;
        var dispWNew = iw * scale, dispHNew = ih * scale;
        left = C / 2 - centerXRatio * dispWNew;
        top = C / 2 - centerYRatio * dispHNew;
        layout();
      }
      zoomInput.addEventListener("input", onZoomInput);

      function onDown(x, y) { dragging = true; startX = x; startY = y; startLeft = left; startTop = top; circle.classList.add("dragging"); }
      function onMove(x, y) { if (!dragging) return; left = startLeft + (x - startX); top = startTop + (y - startY); layout(); }
      function onUp() { dragging = false; circle.classList.remove("dragging"); }
      function onMouseDown(e) { onDown(e.clientX, e.clientY); }
      function onMouseMove(e) { onMove(e.clientX, e.clientY); }
      function onTouchStart(e) { var t = e.touches[0]; onDown(t.clientX, t.clientY); }
      function onTouchMove(e) { var t = e.touches[0]; onMove(t.clientX, t.clientY); }

      circle.addEventListener("mousedown", onMouseDown);
      window.addEventListener("mousemove", onMouseMove);
      window.addEventListener("mouseup", onUp);
      circle.addEventListener("touchstart", onTouchStart, { passive: true });
      circle.addEventListener("touchmove", onTouchMove, { passive: true });
      circle.addEventListener("touchend", onUp);

      function cleanup() {
        window.removeEventListener("mousemove", onMouseMove);
        window.removeEventListener("mouseup", onUp);
      }

      modal.querySelector("#modal-close").addEventListener("click", cleanup);
      document.getElementById("modal-backdrop").addEventListener("click", function (ev) { if (ev.target.id === "modal-backdrop") cleanup(); });
      modal.querySelector("#crop-cancel").addEventListener("click", function () { cleanup(); closeModal(); });
      modal.querySelector("#crop-save").addEventListener("click", function () {
        var outSize = 240;
        var canvas = document.createElement("canvas");
        canvas.width = outSize; canvas.height = outSize;
        var ctx = canvas.getContext("2d");
        var srcX = (0 - left) / scale;
        var srcY = (0 - top) / scale;
        var srcSize = C / scale;
        ctx.drawImage(imgEl, srcX, srcY, srcSize, srcSize, 0, 0, outSize, outSize);
        state.settings.avatarPhoto = canvas.toDataURL("image/jpeg", 0.9);
        persist(); renderAvatar();
        cleanup(); closeModal();
        if (ui.view === "settings") renderView();
        showToast("Foto de perfil atualizada.");
      });
    };
    reader.readAsDataURL(file);
  }

  function removeAvatarPhoto() {
    state.settings.avatarPhoto = null;
    persist(); renderAvatar();
    if (ui.view === "settings") renderView();
    showToast("Foto de perfil removida.");
  }

  function initThemeSwitchIcons() {
    var iconMap = { light: "sun", system: "laptop", dark: "moon" };
    document.querySelectorAll(".theme-switch button[data-theme-opt]").forEach(function (b) {
      b.innerHTML = ic(iconMap[b.getAttribute("data-theme-opt")], 15);
    });
  }

  /* ============ MOBILE DRAWER ============ */
  function openDrawer() { document.getElementById("mobile-drawer-backdrop").classList.remove("hidden"); }
  function closeDrawer() { document.getElementById("mobile-drawer-backdrop").classList.add("hidden"); }

  /* ============ RENDER: SHELL NAV ============ */
  function renderNav() {
    var sideNav = document.getElementById("side-nav");
    var bottomNav = document.getElementById("bottom-nav");
    var drawerNav = document.getElementById("drawer-nav");
    sideNav.innerHTML = "";
    bottomNav.innerHTML = "";
    drawerNav.innerHTML = "";
    NAV_ITEMS.forEach(function (item) {
      var b = document.createElement("button");
      b.className = "nav-item" + (ui.view === item.id ? " active" : "");
      b.innerHTML = ic(item.icon) + "<span>" + item.label + "</span>";
      b.addEventListener("click", function () { setView(item.id); });
      sideNav.appendChild(b);

      var db = document.createElement("button");
      db.className = "nav-item" + (ui.view === item.id ? " active" : "");
      db.innerHTML = ic(item.icon) + "<span>" + item.label + "</span>";
      db.addEventListener("click", function () { setView(item.id); closeDrawer(); });
      drawerNav.appendChild(db);

      if (item.id !== "settings") {
        var bb = document.createElement("button");
        bb.className = ui.view === item.id ? "active" : "";
        bb.innerHTML = ic(item.icon, 20) + "<span>" + item.label + "</span>";
        bb.addEventListener("click", function () { setView(item.id); });
        bottomNav.appendChild(bb);
      }
    });
  }

  function setView(v) {
    ui.view = v;
    document.getElementById("topbar-title").textContent = NAV_ITEMS.filter(function (n) { return n.id === v; })[0].label;
    renderNav();
    renderView();
  }

  /* ============ RENDER ROOT ============ */
  function renderView() {
    var root = document.getElementById("view-root");
    root.innerHTML = "";
    if (ui.view === "dashboard") root.appendChild(viewDashboard());
    else if (ui.view === "agenda") root.appendChild(viewAgenda());
    else if (ui.view === "tasks") root.appendChild(viewTasks());
    else if (ui.view === "habits") root.appendChild(viewHabits());
    else if (ui.view === "goals") root.appendChild(viewGoals());
    else if (ui.view === "settings") { root.appendChild(viewSettings()); renderAvatar(); }
  }

  function el(html) {
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  /* ============ DASHBOARD ============ */
  function viewDashboard() {
    var now = new Date();
    var hour = now.getHours();
    var greet = hour < 12 ? "Bom dia" : hour < 18 ? "Boa tarde" : "Boa noite";
    var name = state.settings.name || "";
    var today = todayISO();

    var todaysAppts = state.appointments.filter(function (a) { return a.date === today; })
      .sort(function (a, b) { return apptDateTime(a) - apptDateTime(b); });
    var pendingTasks = state.tasks.filter(function (t) { return !t.done; })
      .sort(function (a, b) { return (a.dueDate || "9999") < (b.dueDate || "9999") ? -1 : 1; });
    var nextAppt = state.appointments
      .filter(function (a) { return apptDateTime(a) >= now; })
      .sort(function (a, b) { return apptDateTime(a) - apptDateTime(b); })[0];

    var dayStart = new Date(now); dayStart.setHours(6, 0, 0, 0);
    var dayEnd = new Date(now); dayEnd.setHours(23, 59, 0, 0);
    var pct = Math.max(0, Math.min(100, Math.round((now - dayStart) / (dayEnd - dayStart) * 100)));

    var nextLabel = "Nenhum compromisso agendado";
    if (nextAppt) {
      var diffMin = Math.round((apptDateTime(nextAppt) - now) / 60000);
      var when = diffMin < 60 ? diffMin + " min" : Math.floor(diffMin / 60) + "h" + pad2(diffMin % 60);
      nextLabel = nextAppt.title + " em " + when;
    }

    var wrap = el('<div></div>');

    var greetCard = el(
      '<div class="greeting-card glow-border">' +
        '<h1>' + greet + (name ? ", " + name : "") + '.</h1>' +
        '<div class="date-line mono">' + capitalize(fmtFull(now)) + '</div>' +
        '<div class="stat-row glow-border">' +
          statChip(todaysAppts.length, "Compromissos hoje") +
          statChip(pendingTasks.length, "Tarefas pendentes") +
          statChip(state.habits.length, "Hábitos ativos") +
        '</div>' +
        '<div class="progress-wrap">' +
          '<div class="pl"><span>Progresso do dia</span><span class="mono">' + pct + '%</span></div>' +
          '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        '</div>' +
      '</div>'
    );
    wrap.appendChild(greetCard);

    var grid = el('<div class="dash-grid"></div>');

    var agendaPanel = el('<div class="card dash-panel"></div>');
    agendaPanel.innerHTML = '<h3>' + ic("calendar", 16) + 'Agenda de hoje · <span class="mono" style="color:var(--text-muted);font-weight:500;">' + nextLabel + '</span></h3>';
    if (todaysAppts.length === 0) {
      agendaPanel.appendChild(el('<p style="color:var(--text-muted);font-size:0.85rem;">Nenhum compromisso hoje. Aproveite para adiantar tarefas.</p>'));
    } else {
      var ul1 = el('<ul class="mini-list"></ul>');
      todaysAppts.forEach(function (a) {
        var color = (CATEGORY_COLORS.filter(function (c) { return c.id === a.color; })[0] || CATEGORY_COLORS[0]).hex;
        ul1.appendChild(el(
          '<li class="mini-row"><span class="t mono">' + a.time + '</span>' +
          '<span class="txt"><span class="tt">' + escapeHtml(a.title) + '</span>' +
          (a.location ? '<span class="ms"> · ' + escapeHtml(a.location) + '</span>' : '') + '</span>' +
          '<span class="pill-dot" style="color:' + color + '"></span></li>'
        ));
      });
      agendaPanel.appendChild(ul1);
    }
    grid.appendChild(agendaPanel);

    var sidePanels = el('<div style="display:flex;flex-direction:column;gap:18px;"></div>');

    var taskPanel = el('<div class="card dash-panel"></div>');
    taskPanel.innerHTML = '<h3>' + ic("check2", 16) + 'Tarefas urgentes</h3>';
    if (pendingTasks.length === 0) {
      taskPanel.appendChild(el('<p style="color:var(--text-muted);font-size:0.85rem;">Tudo em dia. Nenhuma tarefa pendente.</p>'));
    } else {
      var ul2 = el('<ul class="mini-list"></ul>');
      pendingTasks.slice(0, 5).forEach(function (t) {
        ul2.appendChild(el(
          '<li class="mini-row"><span class="t" style="color:var(--accent);">●</span>' +
          '<span class="txt"><span class="tt">' + escapeHtml(t.title) + '</span>' +
          (t.dueDate ? '<span class="ms"> · vence ' + t.dueDate.split("-").reverse().join("/") + '</span>' : '') + '</span></li>'
        ));
      });
      taskPanel.appendChild(ul2);
    }
    sidePanels.appendChild(taskPanel);

    if (state.habits.length > 0) {
      var habitPanel = el('<div class="card dash-panel"></div>');
      habitPanel.innerHTML = '<h3>' + ic("repeat", 16) + 'Hábitos de hoje</h3>';
      var row = el('<div class="habit-today-row"></div>');
      var dow = now.getDay();
      state.habits.forEach(function (h) {
        var active = h.targetDays.indexOf(dow) !== -1;
        if (!active) return;
        var done = !!h.history[today];
        var b = el('<button class="habit-today-btn' + (done ? " done" : "") + '"><span class="dot-check">' + (done ? ic("check2", 10) : "") + '</span>' + escapeHtml(h.name) + '</button>');
        b.addEventListener("click", function () { toggleHabitDay(h.id, today); });
        row.appendChild(b);
      });
      habitPanel.appendChild(row);
      sidePanels.appendChild(habitPanel);
    }

    grid.appendChild(sidePanels);
    wrap.appendChild(grid);
    return wrap;
  }

  function statChip(n, label) {
    return '<div class="stat-chip"><div class="l">' + label + '</div><div class="n mono">' + n + '</div></div>';
  }

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ============ AGENDA ============ */
  function viewAgenda() {
    var wrap = el('<div></div>');
    var head = el(
      '<div class="section-head"><div><h2>Agenda</h2><p class="hint">Seus compromissos, reuniões e eventos.</p></div></div>'
    );
    var actions = el('<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;"></div>');
    var subtabs = el(
      '<div class="subtabs">' +
        ["list", "day", "week", "month"].map(function (m) {
          var labels = { list: "Lista", day: "Dia", week: "Semana", month: "Mês" };
          return '<button data-mode="' + m + '" class="' + (ui.agendaMode === m ? "active" : "") + '">' + labels[m] + '</button>';
        }).join("") +
      '</div>'
    );
    subtabs.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () { ui.agendaMode = b.getAttribute("data-mode"); renderView(); });
    });
    actions.appendChild(subtabs);
    var addBtn = el('<button class="btn btn-accent">' + ic("plus", 16) + 'Novo compromisso</button>');
    addBtn.addEventListener("click", function () { openAppointmentModal(); });
    actions.appendChild(addBtn);
    head.appendChild(actions);
    wrap.appendChild(head);

    if (ui.agendaMode === "list") wrap.appendChild(agendaList());
    else if (ui.agendaMode === "day") wrap.appendChild(agendaDay());
    else if (ui.agendaMode === "week") wrap.appendChild(agendaWeek());
    else wrap.appendChild(agendaMonth());

    return wrap;
  }

  function colorHex(id) { return (CATEGORY_COLORS.filter(function (c) { return c.id === id; })[0] || CATEGORY_COLORS[0]).hex; }

  function agendaList() {
    var now = new Date();
    var items = state.appointments.slice().sort(function (a, b) { return apptDateTime(a) - apptDateTime(b); })
      .filter(function (a) { return apptDateTime(a) >= new Date(now.getFullYear(), now.getMonth(), now.getDate()); });

    if (items.length === 0) return emptyBlock("calendar", "Nenhum compromisso futuro", "Adicione um novo compromisso para começar a organizar sua agenda.");

    var byDate = {}; var order = [];
    items.forEach(function (a) { if (!byDate[a.date]) { byDate[a.date] = []; order.push(a.date); } byDate[a.date].push(a); });

    var box = el('<div></div>');
    order.forEach(function (dateStr) {
      var d = parseISO(dateStr);
      var isToday = dateStr === todayISO();
      box.appendChild(el('<div class="day-group-head"><span class="dn mono">' + d.getDate() + '</span><span class="dl">' + DOW_FULL[d.getDay()] + ' de ' + MON_FULL[d.getMonth()] + (isToday ? " · hoje" : "") + '</span></div>'));
      var card = el('<div class="card" style="padding:4px 16px;"></div>');
      byDate[dateStr].forEach(function (a) { card.appendChild(timelineItem(a)); });
      box.appendChild(card);
    });
    return box;
  }

  function timelineItem(a) {
    var row = el('<div class="tl-item"></div>');
    row.innerHTML =
      '<div class="tl-time mono">' + a.time + '</div>' +
      '<div class="tl-rail" style="--dot:' + colorHex(a.color) + '"></div>' +
      '<div class="tl-body"><div class="tt">' + escapeHtml(a.title) + '</div><div class="mt">' +
        priorityPill(a.priority) +
        (a.location ? '<span>📍 ' + escapeHtml(a.location) + '</span>' : '') +
        (a.notes ? '<span>' + escapeHtml(a.notes) + '</span>' : '') +
      '</div></div>' +
      '<div class="tl-actions"></div>';
    var actions = row.querySelector(".tl-actions");
    var editB = el('<button class="row-actions" style="display:flex;"></button>');
    var e1 = document.createElement("button"); e1.innerHTML = ic("edit", 14); e1.addEventListener("click", function () { openAppointmentModal(a); });
    var e2 = document.createElement("button"); e2.innerHTML = ic("trash", 14); e2.addEventListener("click", function () { deleteAppointment(a.id); });
    var rowActionsWrap = el('<div class="row-actions"></div>');
    rowActionsWrap.appendChild(e1); rowActionsWrap.appendChild(e2);
    actions.appendChild(rowActionsWrap);
    return row;
  }

  function priorityPill(pid) {
    var p = PRIORITIES.filter(function (x) { return x.id === pid; })[0];
    if (!p) return "";
    var toneVar = p.tone === "muted" ? "text-muted" : p.tone;
    return '<span class="pill" style="background:var(--' + toneVar + '-soft,var(--surface-2));color:var(--' + toneVar + ',var(--text-muted));"><span class="pill-dot"></span>' + p.label + '</span>';
  }

  function agendaDay() {
    var today = todayISO();
    var items = state.appointments.filter(function (a) { return a.date === today; })
      .sort(function (a, b) { return apptDateTime(a) - apptDateTime(b); });
    var box = el('<div></div>');

  function agendaWeek() {
    var box = el('<div></div>');
    var start = ui.weekAnchor;
    var end = addDays(start, 6);
    var nav = el(
      '<div class="nav-arrows" style="margin-bottom:14px;">' +
        '<button data-dir="-1">' + ic("chevronL", 15) + '</button>' +
        '<span class="lbl mono">' + start.getDate() + ' ' + MON_SHORT[start.getMonth()] + ' – ' + end.getDate() + ' ' + MON_SHORT[end.getMonth()] + '</span>' +
        '<button data-dir="1">' + ic("chevronR", 15) + '</button>' +
      '</div>'
    );
    nav.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () { ui.weekAnchor = addDays(ui.weekAnchor, 7 * Number(b.getAttribute("data-dir"))); renderView(); });
    });
    box.appendChild(nav);

    var grid = el('<div class="week-grid"></div>');
    for (var i = 0; i < 7; i++) {
      var d = addDays(start, i);
      var dISO = toISO(d);
      var isToday = dISO === todayISO();
      var col = el('<div class="week-col' + (isToday ? " is-today" : "") + '"></div>');
      col.innerHTML = '<div class="wc-head"><span>' + DOW_SHORT[d.getDay()] + '</span><span class="mono">' + d.getDate() + '</span></div>';
      var dayItems = state.appointments.filter(function (a) { return a.date === dISO; }).sort(function (a, b) { return apptDateTime(a) - apptDateTime(b); });
      dayItems.forEach(function (a) {
        col.innerHTML += '<div class="wc-item" style="--dot:' + colorHex(a.color) + '"><span class="wt">' + a.time + '</span><br>' + escapeHtml(a.title) + '</div>';
      });
      grid.appendChild(col);
    }
    box.appendChild(grid);
    return box;
  }

  function agendaMonth() {
    var box = el('<div></div>');
    var anchor = ui.monthAnchor;
    var nav = el(
      '<div class="nav-arrows" style="margin-bottom:14px;">' +
        '<button data-dir="-1">' + ic("chevronL", 15) + '</button>' +
        '<span class="lbl">' + MON_FULL[anchor.getMonth()] + ' ' + anchor.getFullYear() + '</span>' +
        '<button data-dir="1">' + ic("chevronR", 15) + '</button>' +
      '</div>'
    );
    nav.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () {
        var d = new Date(ui.monthAnchor);
        d.setMonth(d.getMonth() + Number(b.getAttribute("data-dir")));
        ui.monthAnchor = d;
        renderView();
      });
    });
    box.appendChild(nav);

    var grid = el('<div class="month-grid"></div>');
    DOW_SHORT.forEach(function (d) { grid.appendChild(el('<div class="month-dow">' + d + '</div>')); });

    var firstOfMonth = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    var gridStart = addDays(firstOfMonth, -firstOfMonth.getDay());
    var today = todayISO();

    for (var i = 0; i < 42; i++) {
      var d = addDays(gridStart, i);
      var dISO = toISO(d);
      var outside = d.getMonth() !== anchor.getMonth();
      var cell = el('<div class="month-cell' + (outside ? " outside" : "") + (dISO === today ? " is-today" : "") + '"></div>');
      cell.innerHTML = '<div class="mc-num mono">' + d.getDate() + '</div>';
      var dayItems = state.appointments.filter(function (a) { return a.date === dISO; }).sort(function (a, b) { return apptDateTime(a) - apptDateTime(b); });
      dayItems.slice(0, 3).forEach(function (a) {
        cell.innerHTML += '<div class="month-chip" style="--dot:' + colorHex(a.color) + '">' + a.time + ' ' + escapeHtml(a.title) + '</div>';
      });
      if (dayItems.length > 3) cell.innerHTML += '<div class="month-more">+' + (dayItems.length - 3) + ' mais</div>';
      cell.addEventListener("click", function (dISOc) { return function () { ui.agendaMode = "day"; ui.dayAnchor = dISOc; renderView(); }; }(dISO));
      grid.appendChild(cell);
    }
    box.appendChild(grid);
    return box;
  }

  /* ============ HABITS ============ */
  function habitStreak(h) {
    var streak = 0; var d = new Date();
    for (var i = 0; i < 365; i++) {
      var iso = toISO(d);
      var dow = d.getDay();
      if (h.targetDays.indexOf(dow) === -1) { d = addDays(d, -1); continue; }
      if (h.history[iso]) { streak++; d = addDays(d, -1); } else break;
    }
    return streak;
  }

  function toggleHabitDay(habitId, iso) {
    var h = state.habits.filter(function (x) { return x.id === habitId; })[0];
    if (!h) return;
    if (h.history[iso]) delete h.history[iso]; else h.history[iso] = true;
    persist(); renderView();
  }

  function viewHabits() {
    var wrap = el('<div></div>');
    var head = el('<div class="section-head"><div><h2>Hábitos</h2><p class="hint">Construa consistência dia após dia.</p></div></div>');
    var addBtn = el('<button class="btn btn-accent">' + ic("plus", 16) + 'Novo hábito</button>');
    addBtn.addEventListener("click", function () { openHabitModal(); });
    head.appendChild(addBtn);
    wrap.appendChild(head);

    if (state.habits.length === 0) { wrap.appendChild(emptyBlock("repeat", "Nenhum hábito ainda", "Crie hábitos e acompanhe sua sequência.")); return wrap; }

    var start = startOfWeek(new Date());
    var todayDow = new Date().getDay();

    state.habits.forEach(function (h) {
      var card = el('<div class="card habit-card"></div>');
      var streak = habitStreak(h);
      card.innerHTML =
        '<div class="hh"><div><div class="hname">' + escapeHtml(h.name) + '</div>' +
        (h.category ? '<div style="font-size:0.78rem;color:var(--text-muted);">' + escapeHtml(h.category) + '</div>' : '') + '</div>' +
        '<div class="streak">' + (streak > 0 ? ic("flame", 14).replace('class="ic"', 'class="ic" style="vertical-align:-2px;"') + " " + streak + (streak === 1 ? " dia" : " dias") : "—") + '</div></div>';

      var weekRow = el('<div class="habit-week"></div>');
      for (var i = 0; i < 7; i++) {
        var d = addDays(start, i);
        var iso = toISO(d);
        var active = h.targetDays.indexOf(d.getDay()) !== -1;
        var done = !!h.history[iso];
        var isFuture = d > new Date();
        var b = el('<button class="habit-day-btn' + (done ? " done" : "") + (!active ? " inactive" : "") + '">' + DOW_SHORT[d.getDay()].charAt(0) + '</button>');
        if (active && !isFuture) b.addEventListener("click", function (isoC) { return function () { toggleHabitDay(h.id, isoC); }; }(iso));
        else b.disabled = true;
        weekRow.appendChild(b);
      }
      card.appendChild(weekRow);

      var actions = el('<div class="row-actions" style="margin-top:10px;justify-content:flex-end;"></div>');
      var e1 = el('<button>' + ic("edit", 14) + '</button>');
      e1.addEventListener("click", function () { openHabitModal(h); });
      var e2 = el('<button>' + ic("trash", 14) + '</button>');
      e2.addEventListener("click", function () {
        if (!confirm('Excluir o hábito "' + h.name + '"?')) return;
        state.habits = state.habits.filter(function (x) { return x.id !== h.id; });
        persist(); renderView(); showToast("Hábito excluído.");
      });
      actions.appendChild(e1); actions.appendChild(e2);
      card.appendChild(actions);

      wrap.appendChild(card);
      wrap.appendChild(el('<div style="height:10px;"></div>'));
    });

    return wrap;
  }

      var name = modal.querySelector("#hm-name").value.trim();
      if (!name) { showToast("Digite um nome para o hábito."); return; }
      if (selectedDays.length === 0) { showToast("Selecione pelo menos um dia."); return; }
      var data = { name: name, category: modal.querySelector("#hm-category").value.trim(), targetDays: selectedDays };
      if (isEdit) {
        var idx = state.habits.findIndex(function (x) { return x.id === h.id; });
        state.habits[idx] = Object.assign({}, state.habits[idx], data);
        showToast("Hábito atualizado.");
      } else {
        state.habits.push(Object.assign({ id: genId(), history: {} }, data));
        showToast("Hábito adicionado.");
      }
      persist(); closeModal(); renderView();

  /* ============ GOALS ============ */
  function viewGoals() {
    var wrap = el('<div></div>');
    var head = el('<div class="section-head"><div><h2>Metas</h2><p class="hint">Acompanhe seus objetivos de longo prazo.</p></div></div>');
    var addBtn = el('<button class="btn btn-accent">' + ic("plus", 16) + 'Nova meta</button>');
    addBtn.addEventListener("click", function () { openGoalModal(); });
    head.appendChild(addBtn);
    wrap.appendChild(head);

    if (state.goals.length === 0) { wrap.appendChild(emptyBlock("target", "Nenhuma meta definida", "Crie metas e acompanhe sua evolução.")); return wrap; }

    var grid = el('<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;"></div>');
    state.goals.forEach(function (g) {
      var card = el('<div class="card goal-card"></div>');
      var daysLeft = g.deadline ? Math.ceil((parseISO(g.deadline) - new Date()) / 86400000) : null;
      card.innerHTML =
        '<div class="gh"><div><div class="gname">' + escapeHtml(g.title) + '</div>' +
        '<div class="gmeta">' + (g.category ? escapeHtml(g.category) : "Meta") + (daysLeft !== null ? " · " + (daysLeft >= 0 ? daysLeft + " dias restantes" : "prazo encerrado") : "") + '</div></div></div>' +
        '<div class="progress-wrap" style="margin-top:2px;"><div class="pl"><span>Progresso</span><span class="mono">' + g.progress + '%</span></div>' +
        '<div class="progress-track"><div class="progress-fill" style="width:' + g.progress + '%"></div></div></div>';
      var actions = el('<div class="row-actions" style="margin-top:12px;justify-content:flex-end;"></div>');
      var e1 = el('<button>' + ic("edit", 14) + '</button>');
      e1.addEventListener("click", function () { openGoalModal(g); });
      var e2 = el('<button>' + ic("trash", 14) + '</button>');
      e2.addEventListener("click", function () {
        if (!confirm('Excluir a meta "' + g.title + '"?')) return;
        state.goals = state.goals.filter(function (x) { return x.id !== g.id; });
        persist(); renderView(); showToast("Meta excluída.");
      });
      actions.appendChild(e1); actions.appendChild(e2);
      card.appendChild(actions);
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    return wrap;
  }

  function openGoalModal(existing) {
    var isEdit = !!existing;
    var g = existing || { id: null, title: "", category: "", deadline: "", progress: 0, notes: "" };

    var body =
      '<div class="field"><label>Título</label><input id="gm-title" value="' + escapeHtml(g.title) + '" placeholder="Ex.: Ler 12 livros este ano" /></div>' +
      '<div class="row2">' +
        '<div class="field"><label>Categoria</label><input id="gm-category" value="' + escapeHtml(g.category || "") + '" placeholder="Pessoal, Profissional..." /></div>' +
        '<div class="field"><label>Prazo</label><input id="gm-deadline" type="date" value="' + (g.deadline || "") + '" /></div>' +
      '</div>' +
      '<div class="field"><label>Progresso: <span id="gm-progress-val" class="mono">' + g.progress + '%</span></label><input id="gm-progress" type="range" min="0" max="100" value="' + g.progress + '" /></div>' +
      '<div class="field"><label>Notas</label><textarea id="gm-notes" rows="2">' + escapeHtml(g.notes || "") + '</textarea></div>';

    var footer =
      '<div class="modal-actions">' +
        (isEdit ? '<button class="btn btn-danger" id="gm-delete">Excluir</button>' : '') +
        '<button class="btn btn-accent" id="gm-save">' + (isEdit ? "Salvar alterações" : "Adicionar") + '</button>' +
      '</div>';

    var modal = openModal(isEdit ? "Editar meta" : "Nova meta", body, footer);
    modal.querySelector("#gm-progress").addEventListener("input", function (e) {
      modal.querySelector("#gm-progress-val").textContent = e.target.value + "%";
    });

    if (isEdit) modal.querySelector("#gm-delete").addEventListener("click", function () {
      closeModal();
      if (!confirm('Excluir a meta "' + g.title + '"?')) return;
      state.goals = state.goals.filter(function (x) { return x.id !== g.id; });
      persist(); renderView(); showToast("Meta excluída.");
    });

    modal.querySelector("#gm-save").addEventListener("click", function () {
      var title = modal.querySelector("#gm-title").value.trim();
      if (!title) { showToast("Digite um título para a meta."); return; }
      var data = {
        title: title,
        category: modal.querySelector("#gm-category").value.trim(),
        deadline: modal.querySelector("#gm-deadline").value,
        progress: Number(modal.querySelector("#gm-progress").value),
        notes: modal.querySelector("#gm-notes").value.trim()
      };
      if (isEdit) {
        var idx = state.goals.findIndex(function (x) { return x.id === g.id; });
        state.goals[idx] = Object.assign({}, state.goals[idx], data);
        showToast("Meta atualizada.");
      } else {
        state.goals.push(Object.assign({ id: genId() }, data));
        showToast("Meta adicionada.");
      }
      persist(); closeModal(); renderView();
    });
  }

  /* ============ SEARCH ============ */
  function runSearch(query) {
    query = query.trim().toLowerCase();
    var results = document.getElementById("search-results");
    if (!query) { results.classList.add("hidden"); results.innerHTML = ""; return; }
    var matches = [];
    state.appointments.forEach(function (a) { if (a.title.toLowerCase().indexOf(query) !== -1) matches.push({ type: "Compromisso", label: a.title, sub: a.date.split("-").reverse().join("/") + " · " + a.time, view: "agenda" }); });
    state.tasks.forEach(function (t) { if (t.title.toLowerCase().indexOf(query) !== -1) matches.push({ type: "Tarefa", label: t.title, sub: t.done ? "Concluída" : "Pendente", view: "tasks" }); });
    state.habits.forEach(function (h) { if (h.name.toLowerCase().indexOf(query) !== -1) matches.push({ type: "Hábito", label: h.name, sub: h.category || "", view: "habits" }); });
    state.goals.forEach(function (g) { if (g.title.toLowerCase().indexOf(query) !== -1) matches.push({ type: "Meta", label: g.title, sub: g.progress + "% concluído", view: "goals" }); });

    if (matches.length === 0) { results.innerHTML = '<button disabled style="color:var(--text-muted);">Nenhum resultado encontrado</button>'; }
    else {
      results.innerHTML = "";
      matches.slice(0, 8).forEach(function (m) {
        var b = el('<button><div class="sr-type">' + m.type + '</div><div>' + escapeHtml(m.label) + '</div>' + (m.sub ? '<div style="font-size:0.75rem;color:var(--text-muted);">' + escapeHtml(m.sub) + '</div>' : '') + '</button>');
        b.addEventListener("click", function () { setView(m.view); results.classList.add("hidden"); document.getElementById("global-search").value = ""; });
        results.appendChild(b);
      });
    }
    results.classList.remove("hidden");
  }

  /* ============ REMINDERS ============ */
  function checkReminders() {
    var now = new Date();
    state.appointments.forEach(function (a) {
      var when = apptDateTime(a);
      var diffMin = (when - now) / 60000;
      if (diffMin > 0 && diffMin <= 10 && state.settings.notifiedIds.indexOf(a.id) === -1) {
        state.settings.notifiedIds.push(a.id);
        persist();
        var msg = a.title + " às " + a.time + (a.location ? " · " + a.location : "");
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification("ÓRBITA — compromisso em breve", { body: msg });
        }
        showReminderBanner(a.title, msg);
      }
    });
  }
  var reminderTimer = null;
  function showReminderBanner(title, sub) {
    var root = document.getElementById("reminder-root");
    var b = el(
      '<div class="reminder-banner">' + ic("bell", 18) +
      '<div><div class="rb-title">' + escapeHtml(title) + '</div><div class="rb-sub">' + escapeHtml(sub) + '</div></div>' +
      '<button class="rb-close">' + ic("x", 13) + '</button></div>'
    );
    b.querySelector(".rb-close").addEventListener("click", function () { b.remove(); });
    root.appendChild(b);
    setTimeout(function () { if (b.parentNode) b.remove(); }, 12000);
  }

  /* ============ AUTH SCREEN ============ */
  var authMode = "signin";

  function showBootLoading(show) { document.getElementById("boot-loading").classList.toggle("hidden", !show); }
  function showAuthScreen(show) {
    document.getElementById("auth-root").classList.toggle("hidden", !show);
    document.getElementById("shell").classList.toggle("hidden", show);
  }
  function setAuthError(msg) {
    var e1 = document.getElementById("auth-error");
    e1.textContent = msg || "";
    e1.classList.toggle("hidden", !msg);
  }
  function friendlyAuthErrorMessage(raw) {
    var s = String(raw || "").toLowerCase();
    if (s.indexOf("failed to fetch") !== -1 || s.indexOf("networkerror") !== -1 || s.indexOf("load failed") !== -1) {
      return "Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.";
    }
    return raw;
  }
  function setAuthNotice(msg) {
    var e1 = document.getElementById("auth-notice");
    e1.textContent = msg || "";
    e1.classList.toggle("hidden", !msg);
  }
  function setAuthMode(mode) {
    authMode = mode;
    setAuthError(""); setAuthNotice("");
    var isSignup = mode === "signup";
    document.getElementById("auth-title").textContent = isSignup ? "Criar conta" : "Entrar";
    document.getElementById("auth-submit").textContent = isSignup ? "Criar conta" : "Entrar";
    document.getElementById("auth-toggle-text").textContent = isSignup ? "Já tem conta?" : "Não tem conta?";
    document.getElementById("auth-toggle-btn").textContent = isSignup ? "Entrar" : "Criar conta";
  }

  document.getElementById("auth-toggle-btn").addEventListener("click", function () {
    setAuthMode(authMode === "signup" ? "signin" : "signup");
  });

  document.getElementById("auth-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var email = document.getElementById("auth-email").value.trim();
    var password = document.getElementById("auth-password").value;
    setAuthError(""); setAuthNotice("");
    var submitBtn = document.getElementById("auth-submit");
    var originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = "Aguarde...";

    var req = authMode === "signup"
      ? sb.auth.signUp({ email: email, password: password })
      : sb.auth.signInWithPassword({ email: email, password: password });

    req.then(function (res) {
      submitBtn.disabled = false;
      submitBtn.textContent = originalText;
      if (res.error) { setAuthError(friendlyAuthErrorMessage(res.error.message)); return; }
      if (authMode === "signup" && res.data && !res.data.session) {
        setAuthNotice("Conta criada! Verifique seu e-mail para confirmar o cadastro antes de entrar.");
      }
    }).catch(function () {
      submitBtn.disabled = false;
      submitBtn.textContent = originalText;
      setAuthError("Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.");
    });
  });

  function startAppFor(user) {
    currentUser = user;
    loadRemoteState(user.id).catch(function (err) {
      state = defaultState();
      showToast("Não foi possível carregar seus dados. Confirme se o SQL de configuração foi executado no Supabase.");
    }).then(function () {
      showBootLoading(false);
      showAuthScreen(false);
      if (!appStarted) { appStarted = true; init(); }
      else { renderAvatar(); applyTheme(); applyCustomColors(); initThemeSwitchIcons(); renderNav(); renderView(); }
    });
  }

  function stopApp() {
    currentUser = null;
    appStarted = false;
    showBootLoading(false);
    setAuthMode("signin");
    showAuthScreen(true);
  }

  sb.auth.onAuthStateChange(function (event, session) {
    if (session && session.user) startAppFor(session.user);
    else stopApp();
  });

  sb.auth.getSession().then(function (res) {
    var session = res.data && res.data.session;
    if (session && session.user) startAppFor(session.user);
    else stopApp();
  }).catch(function () {
    stopApp();
    setAuthError("Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.");
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
    var reloadedForUpdate = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (reloadedForUpdate) return;
      reloadedForUpdate = true;
      window.location.reload();
    });
  }
})();
</script>
